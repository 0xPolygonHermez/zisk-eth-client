name: Install C++ guest cross-toolchain
description: >
  Install the xPack riscv-none-elf-gcc cross-toolchain + cmake/git used to
  build ziskethone's C++ ZisK guest ELF and its native FFI lib. Needed by any
  job that builds `-p host` (the guest-ziskethone build.rs cross-compiles the
  cpp-guest). Installs to the default prefix guest-ziskethone/build-elf.sh
  expects ($HOME/opt/xpack/...), so no ZISK_TOOLCHAIN_PREFIX override is needed.

inputs:
  xpack-version:
    description: xPack riscv-none-elf-gcc release (without leading v).
    default: "15.2.0-1"

runs:
  using: composite
  steps:
    - name: Install cmake + build tools
      shell: bash
      run: |
        # Use sudo when not already root: this action runs both in root
        # containers (ubuntu:22.04, the GPU image) and on the non-root
        # ubuntu-latest hosted runner (where bare apt-get can't lock).
        SUDO=""
        [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1 && SUDO="sudo"
        if command -v apt-get >/dev/null 2>&1; then
          $SUDO apt-get update
          # binutils (objcopy) is needed by guest-ziskethone build.rs; g++ pulls
          # it in, but request it explicitly so the dependency is not implicit.
          $SUDO apt-get install -y --no-install-recommends \
            cmake make git ca-certificates curl tar xz-utils g++ binutils
        fi

    - name: Install xPack riscv-none-elf-gcc
      shell: bash
      run: |
        set -euo pipefail
        ver="${{ inputs.xpack-version }}"
        prefix="$HOME/opt/xpack/xpack-riscv-none-elf-gcc-${ver}"
        if [ -x "$prefix/bin/riscv-none-elf-g++" ]; then
          echo "toolchain already present at $prefix"
        else
          mkdir -p "$HOME/opt/xpack"
          url="https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${ver}/xpack-riscv-none-elf-gcc-${ver}-linux-x64.tar.gz"
          echo "downloading $url"
          curl -fSL --retry 3 -o /tmp/xpack-riscv.tar.gz "$url"
          tar -xzf /tmp/xpack-riscv.tar.gz -C "$HOME/opt/xpack"
          rm -f /tmp/xpack-riscv.tar.gz
        fi
        # build-elf.sh defaults ZISK_TOOLCHAIN_PREFIX to this path; also expose
        # on PATH for any direct cmake invocation.
        echo "$prefix/bin" >> "$GITHUB_PATH"
        "$prefix/bin/riscv-none-elf-g++" --version | head -1
