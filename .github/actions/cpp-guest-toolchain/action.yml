name: Install C++ guest cross-toolchain
description: >
  Install the xPack riscv-none-elf-gcc cross-toolchain + cmake/git used to
  build ziskethone's C++ ZisK guest ELF and its native FFI lib. Needed by any
  job that builds `-p host` (the guest-ziskethone build.rs cross-compiles the
  cpp-guest). The toolchain itself comes from the repo's own install-xpack.sh, so
  the version and the prefix are pinned in one place; that prefix is what
  build-elf.sh defaults to, so no ZISK_TOOLCHAIN_PREFIX override is needed.

runs:
  using: composite
  steps:
    - name: Install cmake + build tools
      shell: bash
      run: |
        # Use sudo when not already root: this action runs both in root
        # containers (ubuntu:22.04, the GPU image) and on the non-root
        # ubuntu-latest hosted runner (where bare apt-get can't lock).
        SUDO=""
        [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1 && SUDO="sudo"
        if command -v apt-get >/dev/null 2>&1; then
          $SUDO apt-get update
          # binutils (objcopy) is needed by guest-ziskethone build.rs; g++ pulls
          # it in, but request it explicitly so the dependency is not implicit.
          # g++-12 is for the patched-GCC build (.github/actions/zisk-dma-gcc):
          # GCC 14's bundled libcody does not compile under a host g++ newer
          # than ~14, so build-toolchain.sh needs a 13/12/11 to be present.
          # g++-12 exists on both Ubuntu 22.04 and 24.04.
          $SUDO apt-get install -y --no-install-recommends \
            cmake make git ca-certificates curl tar xz-utils g++ binutils g++-12
        fi

    - name: Install xPack riscv-none-elf-gcc
      shell: bash
      run: |
        set -euo pipefail
        # The script is idempotent and prints its prefix on stdout, so a warm
        # cache costs a second and the version stays pinned in exactly one file.
        prefix="$(./crates/clients/ziskethone/guest/install-xpack.sh)"
        # build-elf.sh defaults ZISK_TOOLCHAIN_PREFIX to this path; also expose
        # on PATH for any direct cmake invocation.
        echo "$prefix/bin" >> "$GITHUB_PATH"
