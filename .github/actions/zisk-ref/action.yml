name: Resolve ZisK ref
description: >
  Export ZISK_REF to $GITHUB_ENV as the exact git SHA that the root Cargo.lock
  pins for the zisk-sdk dependency.

runs:
  using: composite
  steps:
    - name: Resolve ZISK_REF from Cargo.lock
      shell: bash
      run: |
        ref="$(awk '
          /^\[\[package\]\]/        { in_zisk = 0 }
          /^name = "zisk-sdk"$/     { in_zisk = 1 }
          in_zisk && /^source = /   { s = $0; sub(/.*#/, "", s); sub(/".*/, "", s); print s; exit }
        ' Cargo.lock)"
        [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || {
          echo "ERROR: could not parse a 40-hex zisk-sdk git SHA from Cargo.lock (is zisk-sdk pinned as a git dependency?)"
          exit 1
        }
        echo "ZISK_REF=$ref" >> "$GITHUB_ENV"
        echo "Resolved ZISK_REF=$ref from Cargo.lock"