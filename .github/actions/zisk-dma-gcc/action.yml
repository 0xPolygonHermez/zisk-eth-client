name: Build the patched GCC for -mzisk-dma
description: >
  Build (or restore from cache) the patched GCC 14.3.0 that lowers block mem*
  operations to the ZisK DMA precompiles. Only needed by jobs that rebuild the
  guest ELF — jobs that embed the committed ELF do not cross-compile at all.

  MUST run after ./.github/actions/cpp-guest-toolchain: the cached prefix holds
  absolute symlinks into the xPack tree for its C++ headers and binutils, and
  restoring it before xPack exists leaves them dangling.

runs:
  using: composite
  steps:
    - name: Restore the patched GCC
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.local/xPacks/zisk-dma-gcc-14.3.0
        # Hash the patch AND this action file on purpose: the resulting
        # compiler depends on how it was built, not only on the patch (e.g.
        # the PATH/env wiring below), so a change to either must invalidate
        # the cache and force a rebuild.
        key: zisk-dma-gcc-${{ runner.os }}-14.3.0-${{ hashFiles('third_party/ziskethone/cpp-guest/patches/gcc/0001-*.patch', '.github/actions/zisk-dma-gcc/action.yml') }}

    - name: Build the patched GCC
      shell: bash
      run: |
        set -euo pipefail
        # Unconditional, cache hit or miss: the script detects an installed
        # compiler and returns in about a second. It is idempotent, so a
        # cache hit and a cold build agree on the result — provided the
        # restored prefix was built by this same procedure, which is what
        # putting this action file in the cache key (above) guarantees.
        # The PATH prefix below is load-bearing, do not "tidy" it away: GCC's
        # configure probes for riscv-none-elf-as on PATH. Without it,
        # gcc_cv_as_riscv_attribute=no and the build silently produces a
        # compiler that still accepts -mzisk-dma but miscompiles the guest,
        # crashing ziskemu at runtime instead of failing here.
        ZISK_XPACK_DIR="$HOME/opt/xpack/xpack-riscv-none-elf-gcc-14.3.0-1" \
        PATH="$HOME/opt/xpack/xpack-riscv-none-elf-gcc-14.3.0-1/bin:$PATH" \
        CXX=g++-12 CC=gcc-12 \
          third_party/ziskethone/cpp-guest/patches/gcc/build-toolchain.sh
