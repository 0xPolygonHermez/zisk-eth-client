name: Setup ZisK dependencies
description: Install system dependencies and ZisK toolchain

runs:
  using: composite
  steps:
    - name: Detect sudo
      shell: bash
      run: |
        if [ "$(id -u)" -eq 0 ]; then echo "SUDO=" >> "$GITHUB_ENV"; else echo "SUDO=sudo" >> "$GITHUB_ENV"; fi

    - name: Install system dependencies
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        $SUDO apt-get update
        $SUDO apt-get install -y apt-utils dialog libterm-readline-perl-perl
        $SUDO apt-get install -y curl git xz-utils jq build-essential qemu-system libomp-dev libgmp-dev \
          nlohmann-json3-dev protobuf-compiler uuid-dev libgrpc++-dev libsecp256k1-dev \
          libsodium-dev libpqxx-dev nasm libopenmpi-dev openmpi-bin openmpi-common \
          ca-certificates gnupg lsb-release wget libclang-dev clang gcc-riscv64-unknown-elf llvm

    - name: Install Node.js 20
      uses: actions/setup-node@v6
      with:
        node-version: 20

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt,clippy

