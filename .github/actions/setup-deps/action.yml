name: Setup ZisK dependencies
description: Install system dependencies and ZisK toolchain

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y curl git xz-utils jq build-essential qemu-system libomp-dev libgmp-dev \
          nlohmann-json3-dev protobuf-compiler uuid-dev libgrpc++-dev libsecp256k1-dev \
          libsodium-dev libpqxx-dev nasm libopenmpi-dev openmpi-bin openmpi-common \
          ca-certificates gnupg lsb-release wget libclang-dev clang gcc-riscv64-unknown-elf

    - name: Install ZisK toolchain
      shell: bash
      env:
        ZISKUP_REF: "v0.16.1"
        ZISKUP_SHA256: "1cdc3bf018cdf58641faf88f503f87b7e35406aad476691e7eba838d578958e4"
        # Obtained via: curl -sSfL "https://raw.githubusercontent.com/0xPolygonHermez/zisk/v0.16.1/ziskup/ziskup" | sha256sum
      run: |
        curl -sSfL "https://raw.githubusercontent.com/0xPolygonHermez/zisk/${ZISKUP_REF}/ziskup/ziskup" -o /tmp/ziskup
        echo "$ZISKUP_SHA256  /tmp/ziskup" | sha256sum -c
        chmod +x /tmp/ziskup
        /tmp/ziskup --nokey
        echo "$HOME/.zisk/bin" >> "$GITHUB_PATH"
