  # Build host binary
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git xz-utils jq build-essential qemu-system libomp-dev libgmp-dev \
            nlohmann-json3-dev protobuf-compiler uuid-dev libgrpc++-dev libsecp256k1-dev \
            libsodium-dev libpqxx-dev nasm libopenmpi-dev openmpi-bin openmpi-common \
            ca-certificates gnupg lsb-release wget libclang-dev clang gcc-riscv64-unknown-elf

      - name: Install ZisK toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/0xPolygonHermez/zisk/main/ziskup/ziskup -o /tmp/ziskup
          chmod +x /tmp/ziskup
          /tmp/ziskup --nokey
          echo "$HOME/.zisk/bin" >> $GITHUB_PATH

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Build host (includes guests via build.rs)
        run: cargo build --release -p host

      - name: Upload host binary
        uses: actions/upload-artifact@v4
        with:
          name: host-binary
          path: target/release/host
          retention-days: 1

  # Test reth client
  test-reth:
    name: Test Reth
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download host binary
        uses: actions/download-artifact@v4
        with:
          name: host-binary
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/host

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git xz-utils jq build-essential qemu-system libomp-dev libgmp-dev \
            nlohmann-json3-dev protobuf-compiler uuid-dev libgrpc++-dev libsecp256k1-dev \
            libsodium-dev libpqxx-dev nasm libopenmpi-dev openmpi-bin openmpi-common \
            ca-certificates gnupg lsb-release wget libclang-dev clang gcc-riscv64-unknown-elf

      - name: Install ZisK toolchain (for emulator)
        run: |
          curl -sSfL https://raw.githubusercontent.com/0xPolygonHermez/zisk/main/ziskup/ziskup -o /tmp/ziskup
          chmod +x /tmp/ziskup
          /tmp/ziskup --nokey
          echo "$HOME/.zisk/bin" >> $GITHUB_PATH

      - name: Execute reth tests (emulator)
        run: |
          ./bin/host --action execute --emulator stateless-validator --client reth --input-folder bin/guests/stateless-validator-reth/inputs

      - name: Execute reth tests (assembly)
        run: |
          ./bin/host --action execute --port 25000 stateless-validator --client reth --input-folder bin/guests/stateless-validator-reth/inputs

  # Test ethrex client
  test-ethrex:
    name: Test Ethrex
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download host binary
        uses: actions/download-artifact@v4
        with:
          name: host-binary
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/host

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git xz-utils jq build-essential qemu-system libomp-dev libgmp-dev \
            nlohmann-json3-dev protobuf-compiler uuid-dev libgrpc++-dev libsecp256k1-dev \
            libsodium-dev libpqxx-dev nasm libopenmpi-dev openmpi-bin openmpi-common \
            ca-certificates gnupg lsb-release wget libclang-dev clang gcc-riscv64-unknown-elf

      - name: Install ZisK toolchain (for emulator)
        run: |
          curl -sSfL https://raw.githubusercontent.com/0xPolygonHermez/zisk/main/ziskup/ziskup -o /tmp/ziskup
          chmod +x /tmp/ziskup
          /tmp/ziskup --nokey
          echo "$HOME/.zisk/bin" >> $GITHUB_PATH

      - name: Execute Ethrex tests (emulator)
        run: |
          ./bin/host --action execute --emulator stateless-validator --client ethrex --input-folder bin/guests/stateless-validator-ethrex/inputs

      - name: Execute reth tests (assembly)
        run: |
          ./bin/host --action execute --port 25000 stateless-validator --client ethrex --input-folder bin/guests/stateless-validator-ethrex/inputs
