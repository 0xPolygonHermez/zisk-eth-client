  #       uses: dtolnay/rust-toolchain@stable
  #       with:
  #         components: clippy

  #     - name: Setup dependencies
  #       uses: ./.github/actions/setup-deps

  #     - name: Cache cargo registry
  #       uses: actions/cache@v4
  #       with:
  #         path: |
  #           ~/.cargo/registry
  #           ~/.cargo/git
  #         key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
  #         restore-keys: |
  #           ${{ runner.os }}-cargo-registry-

  #     - name: Cache target directory
  #       uses: actions/cache@v4
  #       with:
  #         path: target
  #         key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
  #         restore-keys: |
  #           ${{ runner.os }}-target-

  #     - name: Build host
  #       run: cargo build --release -p host

  #     - name: Run Clippy
  #       run: cargo clippy --workspace --all-targets -- -D warnings

  # Test Reth client
  test-reth:
    name: Test Reth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Cache proving key
        id: cache-proving-key
        uses: actions/cache@v4
        with:
          path: ${{ env.PROVING_KEY_DIR }}
          key: proving-key-${{ env.PROVING_KEY_VERSION }}

      - name: Download proving key
        if: steps.cache-proving-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p $PROVING_KEY_DIR
          curl -sSfL "https://storage.googleapis.com/zisk-setup/proving-key-${{ env.PROVING_KEY_VERSION }}.tar.gz" \
            | tar -xz -C $PROVING_KEY_DIR

      - name: Build host
        run: cargo build --release -p host

      - name: Execute Reth Stateless Validation tests (emulator)
        run: |
          ./target/release/host --action execute --emulator --proving-key $PROVING_KEY_DIR stateless-validator --client reth --input-folder bin/guests/stateless-validator-reth/inputs

      - name: Execute Reth Stateless Validation tests (assembly)
        run: |
          ./target/release/host --action execute --port 25000 --proving-key $PROVING_KEY_DIR stateless-validator --client reth --input-folder bin/guests/stateless-validator-reth/inputs

      - name: Verify Reth Stateless Validation constraints (emulator)
        run: |
          ./target/release/host --action verify-constraints --emulator --proving-key $PROVING_KEY_DIR stateless-validator --client reth --input-folder bin/guests/stateless-validator-reth/inputs

      - name: Verify Reth Stateless Validation constraints (assembly)
        run: |
          ./target/release/host --action verify-constraints --port 25000 --proving-key $PROVING_KEY_DIR stateless-validator --client reth --input-folder bin/guests/stateless-validator-reth/inputs

  # Test Ethrex client
  test-ethrex:
    name: Test Ethrex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Cache proving key
        id: cache-proving-key
        uses: actions/cache@v4
        with:
          path: ${{ env.PROVING_KEY_DIR }}
          key: proving-key-${{ env.PROVING_KEY_VERSION }}

      - name: Download proving key
        if: steps.cache-proving-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p $PROVING_KEY_DIR
          curl -sSfL "https://storage.googleapis.com/zisk-setup/proving-key-${{ env.PROVING_KEY_VERSION }}.tar.gz" \
            | tar -xz -C $PROVING_KEY_DIR

      - name: Build host
        run: cargo build --release -p host

      - name: Execute Ethrex Stateless Validation tests (emulator)
        run: |
          ./target/release/host --action execute --emulator --proving-key $PROVING_KEY_DIR stateless-validator --client ethrex --input-folder bin/guests/stateless-validator-ethrex/inputs

      - name: Execute Ethrex Stateless Validation tests (assembly)
        run: |
          ./target/release/host --action execute --port 25000 --proving-key $PROVING_KEY_DIR stateless-validator --client ethrex --input-folder bin/guests/stateless-validator-ethrex/inputs

      - name: Verify Ethrex Stateless Validation constraints (emulator)
        run: |
          ./target/release/host --action verify-constraints --emulator --proving-key $PROVING_KEY_DIR stateless-validator --client ethrex --input-folder bin/guests/stateless-validator-ethrex/inputs

      - name: Verify Ethrex Stateless Validation constraints (assembly)
        run: |
          ./target/release/host --action verify-constraints --port 25000 --proving-key $PROVING_KEY_DIR stateless-validator --client ethrex --input-folder bin/guests/stateless-validator-ethrex/inputs