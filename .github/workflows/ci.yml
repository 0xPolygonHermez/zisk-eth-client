  #     - name: Build host
  #       run: cargo build --release -p host

  #     - name: Run Clippy
  #       run: cargo clippy --workspace --all-targets -- -D warnings

  #     - name: Upload host binary
  #       uses: actions/upload-artifact@v4.6.2
  #       with:
  #         name: host-binary
  #         path: target/release/host
  #         retention-days: 1

  # Build host binary
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Build host
        run: cargo build --release -p host

      - name: Upload host binary
        uses: actions/upload-artifact@v4.6.2
        with:
          name: host-binary
          path: target/release/host
          if-no-files-found: error
          retention-days: 1

  # Test reth client
  test-reth:
    name: Test Reth
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download host binary
        uses: actions/download-artifact@v4.3.0
        with:
          name: host-binary
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/host

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Execute Reth tests (emulator)
        run: |
          ./bin/host --action execute --emulator stateless-validator --client reth --input-folder bin/guests/stateless-validator-reth/inputs

      - name: Execute Reth tests (assembly)
        run: |
          ./bin/host --action execute --port 25000 stateless-validator --client reth --input-folder bin/guests/stateless-validator-reth/inputs

  # Test ethrex client
  test-ethrex:
    name: Test Ethrex
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download host binary
        uses: actions/download-artifact@v4.3.0
        with:
          name: host-binary
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/host

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Execute Ethrex tests (emulator)
        run: |
          ./bin/host --action execute --emulator stateless-validator --client ethrex --input-folder bin/guests/stateless-validator-ethrex/inputs

      - name: Execute Ethrex tests (assembly)
        run: |
          ./bin/host --action execute --port 25000 stateless-validator --client ethrex --input-folder bin/guests/stateless-validator-ethrex/inputs
