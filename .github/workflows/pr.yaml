name: "Test Ethereum Client"

on:
  pull_request:
    branches:
      - main
      - "develop-[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: 1
  # ZISK_REF is resolved by the ./.github/actions/zisk-ref action.
  # Clients exercised by the execute / verify-constraints loops. To add a client,
  # append it here and add its <CLIENT>_TEST_BLOCKS below.
  # `ziskethone` is a C++ (evmone) guest; the hints-mode execute loop skips it
  # (see the Execute job).
  CLIENTS: "reth ethrex ziskethone"
  # Block inputs to test per client (graduated, less MGs to more MGs). All three
  # clients share the SAME block set for cross-client comparison; each block has
  # a committed input under bin/guests/stateless-validator-<client>/inputs/.
  #   25431013 ~17.0M gas / 172 tx   (small)
  #   25431039 ~25.0M gas / 325 tx   (medium)
  #   25431055 ~55.7M gas / 712 tx   (large)
  RETH_TEST_BLOCKS: "25431013 25431039 25431055"
  ETHREX_TEST_BLOCKS: "25431013 25431039 25431055"
  ZISKETHONE_TEST_BLOCKS: "25431013 25431039 25431055"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          # cargo needs the rust-input-gen submodule present to load the workspace.
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install C++ guest cross-toolchain
        uses: ./.github/actions/cpp-guest-toolchain

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-clippy-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-target-

      - name: Install ZisK dependencies
        uses: ./.github/actions/zisk-deps

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  tests:
    name: Tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: self-hosted
    timeout-minutes: 60
    container:
      image: ubuntu:22.04
      options: --shm-size=48g
    defaults:
      run:
        shell: bash
    steps:
      # checkout needs git >= 2.18 in the container, else it falls back to the
      # REST tarball download which can't fetch submodules. The base image ships
      # without git, so install it before checkout.
      - name: Install git (for submodule checkout)
        run: |
          if ! command -v git >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up ZisK build environment
        uses: ./.github/actions/zisk-setup

      - name: Install C++ guest cross-toolchain
        uses: ./.github/actions/cpp-guest-toolchain

      - name: Run cargo test
        run: cargo test --locked -p tests

  proving-key:
    name: Generate proving key
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on:
      group: zisk-gpu
    timeout-minutes: 120
    container:
      image: ziskvm/zisk-runner-gpu:latest
      options: --gpus all --shm-size=48g
    defaults:
      run:
        shell: bash
    env:
      WS: ${{ github.workspace }}/.zk-setup
    steps:
      - uses: actions/checkout@v4

      - name: Install ZisK dependencies
        uses: ./.github/actions/zisk-deps

      - name: Build cargo-zisk
        working-directory: ${{ env.WS }}
        run: |
          cargo build --release -p cargo-zisk --bin cargo-zisk
          mkdir -p "$HOME/.zisk/bin"
          install -m 0755 target/release/cargo-zisk "$HOME/.zisk/bin/cargo-zisk"

      - name: Generate proving key (zisk build_setup.sh)
        working-directory: ${{ env.WS }}/tools/test-env
        env:
          ZISK_GHA: "1" # skip the interactive confirm prompt
          DISABLE_ENV_CONFIRM: "1"
          DISABLE_RECURSIVE_SETUP: "1"
          ONLY_CPU: "1"
          USE_CACHE_SETUP: "1" # reuse a previously generated setup
          INSTALL_SETUP: "1"
          ZISK_REPO_DIR: ${{ env.WS }}
        # build_setup installs the key to $HOME/.zisk/provingKey.
        run: ./build_setup.sh

  # Matrix on mode only (not client): zisk-setup (full build_zisk.sh) and the host
  # build are mode-dependent but client-independent, so we run them once per mode
  # and loop over the clients inside. On a single self-hosted runner the cells
  # serialize anyway, so this just avoids repeating the toolchain build per client.
  execute:
    name: Execute (${{ matrix.mode }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: self-hosted
    timeout-minutes: 60
    container:
      image: ubuntu:22.04
      options: --shm-size=48g
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        mode: [standard, hints]
    steps:
      # checkout needs git >= 2.18 in the container, else it falls back to the
      # REST tarball download which can't fetch submodules. The base image ships
      # without git, so install it before checkout.
      - name: Install git (for submodule checkout)
        run: |
          if ! command -v git >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up ZisK build environment
        uses: ./.github/actions/zisk-setup

      # ziskethone's guest ELF + native FFI lib are cross-compiled by the
      # guest-ziskethone build.rs during `cargo build -p host`.
      - name: Install C++ guest cross-toolchain
        uses: ./.github/actions/cpp-guest-toolchain

      # `--features ziskethone` compiles the ziskethone client into host so the
      # execute loop can run `--client ziskethone`; without it, host's default
      # build omits that client and clap rejects the value. (The C++ toolchain it
      # needs is installed above.)
      - name: Build host
        run: |
          if [ "${{ matrix.mode }}" = "hints" ]; then
            RUSTFLAGS="--cfg zisk_hints" cargo build --locked --release -p host --features ziskethone
          else
            cargo build --locked --release -p host --features ziskethone
          fi

      # emulator runs standard only (hints requires the assembly executor).
      - name: Execute (emulator)
        if: ${{ matrix.mode == 'standard' }}
        run: |
          for client in $CLIENTS; do
            echo "::group::execute $client (emulator)"
            bash tools/ci/run-validation.sh "$client" execute emulator
            echo "::endgroup::"
          done

      # In hints mode, skip ziskethone (the C++ guest is not run under hints in
      # CI). Standard mode runs all clients.
      - name: Execute (assembly)
        run: |
          for client in $CLIENTS; do
            if [ "${{ matrix.mode }}" = "hints" ] && [ "$client" = "ziskethone" ]; then
              echo "::notice::skipping ziskethone in hints mode"
              continue
            fi
            echo "::group::execute $client (assembly, ${{ matrix.mode }})"
            bash tools/ci/run-validation.sh "$client" execute assembly "${{ matrix.mode }}"
            echo "::endgroup::"
          done

  # verify-constraints is standard-mode and client-independent for setup, so run
  # zisk-setup + the host build once and loop over both clients inside.
  test:
    name: Verify constraints
    needs: [proving-key]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on:
      group: zisk-gpu
    timeout-minutes: 45
    container:
      image: ziskvm/zisk-runner-gpu:latest
      options: --gpus all --shm-size=48g
    defaults:
      run:
        shell: bash
    steps:
      # checkout needs git >= 2.18 in the container, else it falls back to the
      # REST tarball download which can't fetch submodules. Install it if the
      # base image lacks it (no-op when already present).
      - name: Install git (for submodule checkout)
        run: |
          if ! command -v git >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify proving key present
        run: |
          [ -d "$HOME/.zisk/provingKey" ] || { echo "ERROR: proving key not found at \$HOME/.zisk/provingKey (the proving-key job installs it on the shared volume)"; exit 1; }

      - name: Set up ZisK build environment
        uses: ./.github/actions/zisk-setup

      - name: Install C++ guest cross-toolchain
        uses: ./.github/actions/cpp-guest-toolchain

      # `--features ziskethone` so the verify-constraints loop can run
      # `--client ziskethone` (C++ toolchain installed above).
      - name: Build host
        run: cargo build --locked --release -p host --features ziskethone

      - name: Verify constraints (emulator)
        run: |
          for client in $CLIENTS; do
            echo "::group::verify-constraints $client (emulator)"
            EXTRA_FLAGS="--gpu --proving-key $HOME/.zisk/provingKey" \
              bash tools/ci/run-validation.sh "$client" verify-constraints emulator
            echo "::endgroup::"
          done

      - name: Verify constraints (assembly)
        run: |
          for client in $CLIENTS; do
            echo "::group::verify-constraints $client (assembly)"
            EXTRA_FLAGS="--gpu --proving-key $HOME/.zisk/provingKey" \
              bash tools/ci/run-validation.sh "$client" verify-constraints assembly
            echo "::endgroup::"
          done
