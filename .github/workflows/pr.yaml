      #   run: |
      #     include_flags=()
      #     for block in $ETHREX_TEST_BLOCKS; do
      #       include_flags+=(--include "$block")
      #     done
      #     ./target/release/host --unlock-mapped-memory --action execute --proving-key "$PROVING_KEY_PATH" stateless-validator --client ethrex --input-folder "$ETHREX_INPUT_FOLDER" "${include_flags[@]}"

      - name: Verify Ethrex Stateless Validation constraints (emulator)
        run: |
          include_flags=()
          for block in $ETHREX_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --emulator --action verify-constraints --proving-key "$PROVING_KEY_PATH" stateless-validator --client ethrex --input-folder "$ETHREX_INPUT_FOLDER" "${include_flags[@]}"

