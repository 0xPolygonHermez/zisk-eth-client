name: "Test Ethereum Client"

# TODO: Add tests with hints

on:
  pull_request:
    branches:
      - main
      - "develop-[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: 1
  # ZISK_REF is resolved by the ./.github/actions/zisk-ref action.
  PIL2_COMPILER_REF: develop-0.10.0
  PIL2_PROOFMAN_REF: pre-develop-1.0.0-beta
  PIL2_PROOFMAN_JS_REF: pre-develop-0.19.0
  # Block inputs to test per client (from less MGs to more MGs).
  # It is good to have shared blocks between clients for easier comparison.
  RETH_TEST_BLOCKS: "25229957 25229955 25229951"
  ETHREX_TEST_BLOCKS: "25229957 25229955 25229951"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-clippy-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-target-

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  proving-key:
    name: Generate proving key
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: gpu-hosted
    timeout-minutes: 120
    container:
      # CUDA-capable image so cargo-zisk builds with GPU support and check-setup
      # can run with --gpu; --gpus all exposes the runner's GPU to the container.
      image: ziskvm/zisk-runner-gpu:latest
      options: --gpus all --shm-size=48g
    defaults:
      run:
        shell: bash
    env:
      WS: ${{ github.workspace }}/.zk-setup
    steps:
      - uses: actions/checkout@v4

      - name: Resolve ZisK ref
        uses: ./.github/actions/zisk-ref

      - name: Clone ZisK
        uses: actions/checkout@v4
        with:
          repository: 0xPolygonHermez/zisk
          ref: ${{ env.ZISK_REF }}
          path: .zk-setup

      - name: Install ZisK dependencies (zisk install_deps.sh)
        working-directory: ${{ env.WS }}/tools/test-env
        run: |
          bash install_deps.sh --cuda
          # install_deps.sh installs Rust via rustup but only updates PATH in its
          # own shell; expose cargo to the later build steps.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # proofman's starks-lib-c build script compiles GPU support only when it
          # finds /usr/local/cuda/bin/nvcc (or nvcc on PATH). cuda-toolkit-12-9
          # installs under /usr/local/cuda-12.9, so ensure the version-less symlink
          # exists, then fail fast if nvcc still isn't usable — otherwise the host
          # silently builds CPU-only and rejects --gpu at runtime.
          if [ ! -e /usr/local/cuda ]; then
            cuda_dir="$(ls -d /usr/local/cuda-* 2>/dev/null | sort -V | tail -n1 || true)"
            [ -n "$cuda_dir" ] && ln -sfn "$cuda_dir" /usr/local/cuda
          fi
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          /usr/local/cuda/bin/nvcc --version

      - name: Build cargo-zisk
        working-directory: ${{ env.WS }}
        run: |
          cargo build --release -p cargo-zisk --bin cargo-zisk
          mkdir -p "$HOME/.zisk/bin"
          install -m 0755 target/release/cargo-zisk "$HOME/.zisk/bin/cargo-zisk"

      - name: Generate proving key (zisk build_setup.sh)
        working-directory: ${{ env.WS }}/tools/test-env
        env:
          ZISK_GHA: "1" # skip .env loading and the interactive confirm prompt
          DISABLE_ENV_CONFIRM: "1"
          DISABLE_RECURSIVE_SETUP: "1"
          USE_CACHE_SETUP: "1" # reuse a previously generated setup (keyed by PIL content hash, under $HOME/output)
          ZISK_REPO_DIR: ${{ env.WS }}
          PIL2_COMPILER_BRANCH: ${{ env.PIL2_COMPILER_REF }}
          PIL2_PROOFMAN_BRANCH: ${{ env.PIL2_PROOFMAN_REF }}
          PIL2_PROOFMAN_JS_BRANCH: ${{ env.PIL2_PROOFMAN_JS_REF }}
        # build_setup installs the key to $HOME/.zisk/provingKey.
        run: ./build_setup.sh

  test-reth:
    name: Test Reth
    needs: [fmt, clippy, proving-key]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: gpu-hosted
    timeout-minutes: 45
    container:
      # CUDA-capable image + --gpus all so the host builds with GPU support and
      # runs with --gpu.
      image: ziskvm/zisk-runner-gpu:latest
      options: --gpus all --shm-size=48g
    defaults:
      run:
        shell: bash
    env:
      TARGET_CACHE_SCOPE: reth
      WS: ${{ github.workspace }}/.zk-setup
      RETH_INPUT_FOLDER: bin/guests/stateless-validator-reth/inputs
    steps:
      - uses: actions/checkout@v4

      - name: Verify test inputs exist
        run: |
          shopt -s nullglob
          for block in $RETH_TEST_BLOCKS; do
            matches=("${RETH_INPUT_FOLDER}"/mainnet_"${block}"_*.bin)
            ((${#matches[@]} > 0)) || { echo "ERROR: no input file for block $block in $RETH_INPUT_FOLDER"; exit 1; }
          done

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: |
            target
            bin/guests/stateless-validator-reth/target
            bin/guests/stateless-validator-ethrex/target
          key: ${{ runner.os }}-selfhosted-target-gpu-${{ env.TARGET_CACHE_SCOPE }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-selfhosted-target-gpu-${{ env.TARGET_CACHE_SCOPE }}-

      - name: Verify proving key present
        run: |
          [ -d "$HOME/.zisk/provingKey" ] || { echo "ERROR: proving key not found at \$HOME/.zisk/provingKey (the proving-key job installs it on the shared volume)"; exit 1; }

      - name: Resolve ZisK ref
        uses: ./.github/actions/zisk-ref

      - name: Clone ZisK
        uses: actions/checkout@v4
        with:
          repository: 0xPolygonHermez/zisk
          ref: ${{ env.ZISK_REF }}
          path: .zk-setup

      - name: Install ZisK dependencies (zisk install_deps.sh)
        working-directory: ${{ env.WS }}/tools/test-env
        run: |
          bash install_deps.sh --cuda
          # install_deps.sh installs Rust via rustup but only updates PATH in its
          # own shell; expose cargo to the later build steps.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # proofman's starks-lib-c build script compiles GPU support only when it
          # finds /usr/local/cuda/bin/nvcc (or nvcc on PATH). cuda-toolkit-12-9
          # installs under /usr/local/cuda-12.9, so ensure the version-less symlink
          # exists, then fail fast if nvcc still isn't usable — otherwise the host
          # silently builds CPU-only and rejects --gpu at runtime.
          if [ ! -e /usr/local/cuda ]; then
            cuda_dir="$(ls -d /usr/local/cuda-* 2>/dev/null | sort -V | tail -n1 || true)"
            [ -n "$cuda_dir" ] && ln -sfn "$cuda_dir" /usr/local/cuda
          fi
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          /usr/local/cuda/bin/nvcc --version

      - name: Build ZisK (zisk build_zisk.sh)
        working-directory: ${{ env.WS }}/tools/test-env
        env:
          ZISK_GHA: "1" # skip .env loading and the interactive confirm prompt
          DISABLE_ENV_CONFIRM: "1"
          ZISK_REPO_DIR: ${{ env.WS }}
        run: |
          ./build_zisk.sh
          echo "$HOME/.zisk/bin" >> "$GITHUB_PATH"

      - name: Build host
        run: cargo build --locked --release -p host

      - name: Execute Reth stateless validation tests (emulator)
        run: |
          include_flags=()
          for block in $RETH_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --emulator --action execute --gpu --proving-key "$HOME/.zisk/provingKey" stateless-validator --client reth --input-folder "$RETH_INPUT_FOLDER" "${include_flags[@]}"

      - name: Execute Reth stateless validation tests (assembly)
        run: |
          include_flags=()
          for block in $RETH_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --unlock-mapped-memory --action execute --gpu --proving-key "$HOME/.zisk/provingKey" stateless-validator --client reth --input-folder "$RETH_INPUT_FOLDER" "${include_flags[@]}"

      - name: Verify Reth stateless validation constraints (emulator)
        run: |
          include_flags=()
          for block in $RETH_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --emulator --action verify-constraints --gpu --proving-key "$HOME/.zisk/provingKey" stateless-validator --client reth --input-folder "$RETH_INPUT_FOLDER" "${include_flags[@]}"

      - name: Verify Reth stateless validation constraints (assembly)
        run: |
          include_flags=()
          for block in $RETH_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --unlock-mapped-memory --action verify-constraints --gpu --proving-key "$HOME/.zisk/provingKey" stateless-validator --client reth --input-folder "$RETH_INPUT_FOLDER" "${include_flags[@]}"

  test-ethrex:
    name: Test Ethrex
    needs: [fmt, clippy, proving-key]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: gpu-hosted
    timeout-minutes: 45
    container:
      # CUDA-capable image + --gpus all so the host builds with GPU support and
      # runs with --gpu.
      image: ziskvm/zisk-runner-gpu:latest
      options: --gpus all --shm-size=48g
    defaults:
      run:
        shell: bash
    env:
      TARGET_CACHE_SCOPE: ethrex
      WS: ${{ github.workspace }}/.zk-setup
      ETHREX_INPUT_FOLDER: bin/guests/stateless-validator-ethrex/inputs
    steps:
      - uses: actions/checkout@v4

      - name: Verify test inputs exist
        run: |
          shopt -s nullglob
          for block in $ETHREX_TEST_BLOCKS; do
            matches=("${ETHREX_INPUT_FOLDER}"/mainnet_"${block}"_*.bin)
            ((${#matches[@]} > 0)) || { echo "ERROR: no input file for block $block in $ETHREX_INPUT_FOLDER"; exit 1; }
          done

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: |
            target
            bin/guests/stateless-validator-reth/target
            bin/guests/stateless-validator-ethrex/target
          key: ${{ runner.os }}-selfhosted-target-gpu-${{ env.TARGET_CACHE_SCOPE }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-selfhosted-target-gpu-${{ env.TARGET_CACHE_SCOPE }}-

      - name: Verify proving key present
        run: |
          [ -d "$HOME/.zisk/provingKey" ] || { echo "ERROR: proving key not found at \$HOME/.zisk/provingKey (the proving-key job installs it on the shared volume)"; exit 1; }

      - name: Resolve ZisK ref
        uses: ./.github/actions/zisk-ref

      - name: Clone ZisK
        uses: actions/checkout@v4
        with:
          repository: 0xPolygonHermez/zisk
          ref: ${{ env.ZISK_REF }}
          path: .zk-setup

      - name: Install ZisK dependencies (zisk install_deps.sh)
        working-directory: ${{ env.WS }}/tools/test-env
        run: |
          bash install_deps.sh --cuda
          # install_deps.sh installs Rust via rustup but only updates PATH in its
          # own shell; expose cargo to the later build steps.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # proofman's starks-lib-c build script compiles GPU support only when it
          # finds /usr/local/cuda/bin/nvcc (or nvcc on PATH). cuda-toolkit-12-9
          # installs under /usr/local/cuda-12.9, so ensure the version-less symlink
          # exists, then fail fast if nvcc still isn't usable — otherwise the host
          # silently builds CPU-only and rejects --gpu at runtime.
          if [ ! -e /usr/local/cuda ]; then
            cuda_dir="$(ls -d /usr/local/cuda-* 2>/dev/null | sort -V | tail -n1 || true)"
            [ -n "$cuda_dir" ] && ln -sfn "$cuda_dir" /usr/local/cuda
          fi
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          /usr/local/cuda/bin/nvcc --version

      - name: Build ZisK (zisk build_zisk.sh)
        working-directory: ${{ env.WS }}/tools/test-env
        env:
          ZISK_GHA: "1" # skip .env loading and the interactive confirm prompt
          DISABLE_ENV_CONFIRM: "1"
          ZISK_REPO_DIR: ${{ env.WS }}
        run: |
          ./build_zisk.sh
          echo "$HOME/.zisk/bin" >> "$GITHUB_PATH"

      - name: Build host
        run: cargo build --locked --release -p host

      - name: Execute Ethrex stateless validation tests (emulator)
        run: |
          include_flags=()
          for block in $ETHREX_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --emulator --action execute --gpu --proving-key "$HOME/.zisk/provingKey" stateless-validator --client ethrex --input-folder "$ETHREX_INPUT_FOLDER" "${include_flags[@]}"

      - name: Execute Ethrex stateless validation tests (assembly)
        run: |
          include_flags=()
          for block in $ETHREX_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --unlock-mapped-memory --action execute --gpu --proving-key "$HOME/.zisk/provingKey" stateless-validator --client ethrex --input-folder "$ETHREX_INPUT_FOLDER" "${include_flags[@]}"

      - name: Verify Ethrex stateless validation constraints (emulator)
        run: |
