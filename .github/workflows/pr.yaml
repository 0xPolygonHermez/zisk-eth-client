name: Test Ethereum Client

# TODO: Add tests with hints
# TODO: Add gpu testing

on:
  pull_request:
    branches:
      - main
      - "develop-[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: 1
  ZISK_REF: pre-develop-1.0.0-beta
  PIL2_COMPILER_REF: develop-0.10.0
  PIL2_PROOFMAN_REF: pre-develop-1.0.0-beta
  PIL2_PROOFMAN_JS_REF: pre-develop-0.19.0
  PROVING_KEY_DIR: /tmp/zisk-provingkey
  PROVING_KEY_PATH: /tmp/zisk-provingkey/provingKey

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-clippy-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-target-

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  proving-key:
    name: Generate proving key
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: self-hosted
    timeout-minutes: 120
    container:
      image: ubuntu:22.04
      options: --shm-size=48g
    defaults:
      run:
        shell: bash
    env:
      WS: ${{ github.workspace }}/.zk-setup
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute proving-key cache key
        id: key
        run: echo "value=provingkey-${ZISK_REF}-${PIL2_PROOFMAN_REF}-${PIL2_PROOFMAN_JS_REF}-${PIL2_COMPILER_REF}-v1" >> "$GITHUB_OUTPUT"

      - name: Look up proving key cache
        id: cache-proving-key
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PROVING_KEY_DIR }}
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

      - name: Setup dependencies
        if: steps.cache-proving-key.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-deps

      - name: Clone ZisK and PIL2 sources
        if: steps.cache-proving-key.outputs.cache-hit != 'true'
        run: |
          rm -rf "$WS"
          mkdir -p "$WS"
          cd "$WS"
          git clone --depth 1 --branch "$ZISK_REF"             https://github.com/0xPolygonHermez/zisk.git
          git clone --depth 1 --branch "$PIL2_COMPILER_REF"    https://github.com/0xPolygonHermez/pil2-compiler.git
          git clone --depth 1 --branch "$PIL2_PROOFMAN_REF"    https://github.com/0xPolygonHermez/pil2-proofman.git
          git clone --depth 1 --branch "$PIL2_PROOFMAN_JS_REF" https://github.com/0xPolygonHermez/pil2-proofman-js.git
          ( cd pil2-compiler && npm i )
          ( cd pil2-proofman-js && npm i )

      - name: Build cargo-zisk and fixed-columns generators
        if: steps.cache-proving-key.outputs.cache-hit != 'true'
        working-directory: ${{ env.WS }}/zisk
        run: |
          cargo build --release -p cargo-zisk --bin cargo-zisk
          cargo run --release --bin arith_frops_fixed_gen
          cargo run --release --bin binary_basic_frops_fixed_gen
          cargo run --release --bin binary_extension_frops_fixed_gen

      - name: Compile ZisK PIL
        if: steps.cache-proving-key.outputs.cache-hit != 'true'
        working-directory: ${{ env.WS }}/zisk
        run: |
          node --max-old-space-size=16384 "$WS/pil2-compiler/src/pil.js" pil/zisk.pil \
            -I pil,"$WS/pil2-proofman/pil2-components/lib/std/pil",state-machines,precompiles \
            -o pil/zisk.pilout -u tmp/fixed -O fixed-to-file

      - name: Generate setup (non-recursive)
        if: steps.cache-proving-key.outputs.cache-hit != 'true'
        working-directory: ${{ env.WS }}/zisk
        run: |
          node --max-old-space-size=16384 --stack-size=8192 \
            "$WS/pil2-proofman-js/src/main_setup.js" \
            -a ./pil/zisk.pilout -b build -u tmp/fixed \
            -s state-machines/starkstructs.json

      - name: Install proving key and generate constant trees
        if: steps.cache-proving-key.outputs.cache-hit != 'true'
        working-directory: ${{ env.WS }}/zisk
        run: |
          rm -rf "$PROVING_KEY_DIR"
          mkdir -p "$PROVING_KEY_DIR"
          cp -R build/provingKey "$PROVING_KEY_PATH"
          # -a disables proofs aggregation (we built a non-recursive setup); CPU only.
          ./target/release/cargo-zisk check-setup --proving-key "$PROVING_KEY_PATH" -a

      - name: Save proving key
        if: steps.cache-proving-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PROVING_KEY_DIR }}
          key: ${{ steps.key.outputs.value }}

  test-reth:
    name: Test Reth
    needs: [fmt, clippy, proving-key]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: self-hosted
    timeout-minutes: 45
    container:
      image: ubuntu:22.04
      options: --shm-size=48g
    defaults:
      run:
        shell: bash
    env:
      # Add as many input blocks as needed (from less MGs to more MGs)
      RETH_TEST_BLOCKS: "24647140 24697070 24628590"
      RETH_INPUT_FOLDER: bin/guests/stateless-validator-reth/inputs
    steps:
      - uses: actions/checkout@v4

      - name: Verify test inputs exist
        run: |
          shopt -s nullglob
          for block in $RETH_TEST_BLOCKS; do
            matches=("${RETH_INPUT_FOLDER}"/mainnet_"${block}"_*.bin)
            ((${#matches[@]} > 0)) || { echo "ERROR: no input file for block $block in $RETH_INPUT_FOLDER"; exit 1; }
          done

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: |
            target
            bin/guests/stateless-validator-reth/target
            bin/guests/stateless-validator-ethrex/target
          key: ${{ runner.os }}-selfhosted-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-selfhosted-target-

      - name: Restore proving key
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PROVING_KEY_DIR }}
          key: ${{ needs.proving-key.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build host
        run: cargo build --locked --release -p host

      - name: Execute Reth stateless validation tests (emulator)
        run: |
          include_flags=()
          for block in $RETH_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --emulator --action execute --proving-key "$PROVING_KEY_PATH" stateless-validator --client reth --input-folder "$RETH_INPUT_FOLDER" "${include_flags[@]}"

      - name: Execute Reth stateless validation tests (assembly)
        run: |
          include_flags=()
          for block in $RETH_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --unlock-mapped-memory --action execute --proving-key "$PROVING_KEY_PATH" stateless-validator --client reth --input-folder "$RETH_INPUT_FOLDER" "${include_flags[@]}"

      - name: Verify Reth Stateless Validation constraints (emulator)
        run: |
          include_flags=()
          for block in $RETH_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --emulator --action verify-constraints --proving-key "$PROVING_KEY_PATH" stateless-validator --client reth --input-folder "$RETH_INPUT_FOLDER" "${include_flags[@]}"

      - name: Verify Reth Stateless Validation constraints (assembly)
        run: |
          include_flags=()
          for block in $RETH_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --unlock-mapped-memory --action verify-constraints --proving-key "$PROVING_KEY_PATH" stateless-validator --client reth --input-folder "$RETH_INPUT_FOLDER" "${include_flags[@]}"

  test-ethrex:
    name: Test Ethrex
    needs: [fmt, clippy, proving-key]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: self-hosted
    timeout-minutes: 45
    container:
      image: ubuntu:22.04
      options: --shm-size=48g
    defaults:
      run:
        shell: bash
    env:
      # Add as many input blocks as needed (from less MGs to more MGs)
      ETHREX_TEST_BLOCKS: "25128350 24697070 24697073"
      ETHREX_INPUT_FOLDER: bin/guests/stateless-validator-ethrex/inputs
    steps:
      - uses: actions/checkout@v4

      - name: Verify test inputs exist
        run: |
          shopt -s nullglob
          for block in $ETHREX_TEST_BLOCKS; do
            matches=("${ETHREX_INPUT_FOLDER}"/mainnet_"${block}"_*.bin)
            ((${#matches[@]} > 0)) || { echo "ERROR: no input file for block $block in $ETHREX_INPUT_FOLDER"; exit 1; }
          done

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: |
            target
            bin/guests/stateless-validator-reth/target
            bin/guests/stateless-validator-ethrex/target
          key: ${{ runner.os }}-selfhosted-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-selfhosted-target-

      - name: Restore proving key
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PROVING_KEY_DIR }}
          key: ${{ needs.proving-key.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build host
        run: cargo build --locked --release -p host

      - name: Execute Ethrex stateless validation tests (emulator)
        run: |
          include_flags=()
          for block in $ETHREX_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --emulator --action execute --proving-key "$PROVING_KEY_PATH" stateless-validator --client ethrex --input-folder "$ETHREX_INPUT_FOLDER" "${include_flags[@]}"

      # TODO: We need a runner with more memory
