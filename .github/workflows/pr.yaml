name: Test Ethereum Client

# TODO: Add tests with hints
# TODO: Add gpu testing

on:
  pull_request:
    branches:
      - main
      - "develop-[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: 1
  ZISK_REF: pre-develop-1.0.0-beta
  PIL2_COMPILER_REF: develop-0.10.0
  PIL2_PROOFMAN_REF: pre-develop-1.0.0-beta
  PIL2_PROOFMAN_JS_REF: pre-develop-0.19.0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-clippy-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-target-

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  proving-key:
    name: Generate proving key
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: self-hosted
    timeout-minutes: 120
    container:
      image: ubuntu:22.04
      options: --shm-size=48g
    defaults:
      run:
        shell: bash
    env:
      WS: ${{ github.workspace }}/.zk-setup
    steps:
      - uses: actions/checkout@v4

      - name: Compute proving-key cache key
        id: key
        run: echo "value=provingkey-${ZISK_REF}-${PIL2_PROOFMAN_REF}-${PIL2_PROOFMAN_JS_REF}-${PIL2_COMPILER_REF}-v1" >> "$GITHUB_OUTPUT"

      - name: Check for existing proving key
        id: pk
        run: |
          # The proving key persists on the shared $HOME/.zisk across jobs and runs.
          # Skip (re)generation when it's already installed for this exact version.
          marker="$HOME/.zisk/.provingkey-version"
          if [ -d "$HOME/.zisk/provingKey" ] && [ "$(cat "$marker" 2>/dev/null)" = "${{ steps.key.outputs.value }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Proving key ${{ steps.key.outputs.value }} already installed at \$HOME/.zisk/provingKey"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup dependencies
        if: steps.pk.outputs.exists != 'true'
        uses: ./.github/actions/setup-deps

      - name: Clone ZisK
        if: steps.pk.outputs.exists != 'true'
        run: |
          rm -rf "$WS"
          git clone --depth 1 --branch "$ZISK_REF" https://github.com/0xPolygonHermez/zisk.git "$WS"

      - name: Build cargo-zisk
        if: steps.pk.outputs.exists != 'true'
        working-directory: ${{ env.WS }}
        run: |
          cargo build --release -p cargo-zisk --bin cargo-zisk
          mkdir -p "$HOME/.zisk/bin"
          install -m 0755 target/release/cargo-zisk "$HOME/.zisk/bin/cargo-zisk"

      - name: Generate proving key (zisk build_setup.sh)
        if: steps.pk.outputs.exists != 'true'
        working-directory: ${{ env.WS }}/tools/test-env
        env:
          ZISK_GHA: "1" # skip .env loading and the interactive confirm prompt
          DISABLE_ENV_CONFIRM: "1"
          DISABLE_RECURSIVE_SETUP: "1" # non-recursive is enough for execute / verify-constraints
          ONLY_CPU: "1" # no GPU on the runner -> check-setup runs without --gpu
          ZISK_REPO_DIR: ${{ env.WS }}
          PIL2_COMPILER_BRANCH: ${{ env.PIL2_COMPILER_REF }}
          PIL2_PROOFMAN_BRANCH: ${{ env.PIL2_PROOFMAN_REF }}
          PIL2_PROOFMAN_JS_BRANCH: ${{ env.PIL2_PROOFMAN_JS_REF }}
        run: |
          ./build_setup.sh
          # build_setup installs the key to $HOME/.zisk/provingKey (read directly by
          # the test jobs). Record the version so later runs can skip regeneration.
          echo "${{ steps.key.outputs.value }}" > "$HOME/.zisk/.provingkey-version"

  test-reth:
    name: Test Reth
    needs: [fmt, clippy, proving-key]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: self-hosted
    timeout-minutes: 45
    container:
      image: ubuntu:22.04
      options: --shm-size=48g
    defaults:
      run:
        shell: bash
    env:
      TARGET_CACHE_SCOPE: reth
      # Add as many input blocks as needed (from less MGs to more MGs)
      RETH_TEST_BLOCKS: "24647140 24697070 24628590"
      RETH_INPUT_FOLDER: bin/guests/stateless-validator-reth/inputs
    steps:
      - uses: actions/checkout@v4

      - name: Verify test inputs exist
        run: |
          shopt -s nullglob
          for block in $RETH_TEST_BLOCKS; do
            matches=("${RETH_INPUT_FOLDER}"/mainnet_"${block}"_*.bin)
            ((${#matches[@]} > 0)) || { echo "ERROR: no input file for block $block in $RETH_INPUT_FOLDER"; exit 1; }
          done

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: |
            target
            bin/guests/stateless-validator-reth/target
            bin/guests/stateless-validator-ethrex/target
          key: ${{ runner.os }}-selfhosted-target-${{ env.TARGET_CACHE_SCOPE }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-selfhosted-target-${{ env.TARGET_CACHE_SCOPE }}-

      - name: Verify proving key present
        run: |
          [ -d "$HOME/.zisk/provingKey" ] || { echo "ERROR: proving key not found at \$HOME/.zisk/provingKey (the proving-key job installs it on the shared volume)"; exit 1; }

      - name: Build host
        run: cargo build --locked --release -p host

      - name: Execute Reth stateless validation tests (emulator)
        run: |
          include_flags=()
          for block in $RETH_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --emulator --action execute --proving-key "$HOME/.zisk/provingKey" stateless-validator --client reth --input-folder "$RETH_INPUT_FOLDER" "${include_flags[@]}"

      - name: Execute Reth stateless validation tests (assembly)
        run: |
          include_flags=()
          for block in $RETH_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --unlock-mapped-memory --action execute --proving-key "$HOME/.zisk/provingKey" stateless-validator --client reth --input-folder "$RETH_INPUT_FOLDER" "${include_flags[@]}"

      - name: Verify Reth Stateless Validation constraints (emulator)
        run: |
          include_flags=()
          for block in $RETH_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --emulator --action verify-constraints --proving-key "$HOME/.zisk/provingKey" stateless-validator --client reth --input-folder "$RETH_INPUT_FOLDER" "${include_flags[@]}"

      - name: Verify Reth Stateless Validation constraints (assembly)
        run: |
          include_flags=()
          for block in $RETH_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --unlock-mapped-memory --action verify-constraints --proving-key "$HOME/.zisk/provingKey" stateless-validator --client reth --input-folder "$RETH_INPUT_FOLDER" "${include_flags[@]}"

  test-ethrex:
    name: Test Ethrex
    needs: [fmt, clippy, proving-key]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: self-hosted
    timeout-minutes: 45
    container:
      image: ubuntu:22.04
      options: --shm-size=48g
    defaults:
      run:
        shell: bash
    env:
      TARGET_CACHE_SCOPE: ethrex
      # Add as many input blocks as needed (from less MGs to more MGs)
      ETHREX_TEST_BLOCKS: "25128350 24697070 24697073"
      ETHREX_INPUT_FOLDER: bin/guests/stateless-validator-ethrex/inputs
    steps:
      - uses: actions/checkout@v4

      - name: Verify test inputs exist
        run: |
          shopt -s nullglob
          for block in $ETHREX_TEST_BLOCKS; do
            matches=("${ETHREX_INPUT_FOLDER}"/mainnet_"${block}"_*.bin)
            ((${#matches[@]} > 0)) || { echo "ERROR: no input file for block $block in $ETHREX_INPUT_FOLDER"; exit 1; }
          done

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: |
            target
            bin/guests/stateless-validator-reth/target
            bin/guests/stateless-validator-ethrex/target
          key: ${{ runner.os }}-selfhosted-target-${{ env.TARGET_CACHE_SCOPE }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-selfhosted-target-${{ env.TARGET_CACHE_SCOPE }}-

      - name: Verify proving key present
        run: |
          [ -d "$HOME/.zisk/provingKey" ] || { echo "ERROR: proving key not found at \$HOME/.zisk/provingKey (the proving-key job installs it on the shared volume)"; exit 1; }

      - name: Build host
        run: cargo build --locked --release -p host

      - name: Execute Ethrex stateless validation tests (emulator)
        run: |
          include_flags=()
          for block in $ETHREX_TEST_BLOCKS; do
            include_flags+=(--include "$block")
          done
          ./target/release/host --emulator --action execute --proving-key "$HOME/.zisk/provingKey" stateless-validator --client ethrex --input-folder "$ETHREX_INPUT_FOLDER" "${include_flags[@]}"

      # TODO: We need a runner with more memory
