name: "Cycle tracking"

on:
  pull_request:
    branches:
      - main
      - "develop-[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base branch to compare against (manual runs only)"
        required: false
        default: "main"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # ZisK ref to build the emulator from. Must match the zisk-sdk the guests link
  # against (Cargo.toml). The emulator is held fixed across the PR/base passes so
  # the diff reflects only guest changes.
  ZISK_REF: pre-develop-1.0.0-beta
  # Blocks to emulate per client.
  RETH_BLOCKS: "24647140 24697070 24628590"
  ETHREX_BLOCKS: "25128350 24697070 24697073"

jobs:
  cycle-tracking:
    name: "Compare emulator cost vs base branch"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Free disk space"
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: "Checkout sources"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup dependencies"
        uses: ./.github/actions/setup-deps

      # cargo-zisk and ziskemu are built and run from a local clone of the ZisK
      # repo (kept in $HOME/zisk, outside the workspace so it survives the
      # base-branch checkout/clean). The clone always tracks the tip of ZISK_REF,
      # so the cycle-tracker reflects the latest ZisK; the build is cached by the
      # resolved commit SHA, so it only rebuilds when that tip actually moves.
      - name: "Clone ZisK"
        id: zisk
        run: |
          rm -rf "$HOME/zisk"
          git clone --depth 1 --branch "$ZISK_REF" https://github.com/0xPolygonHermez/zisk.git "$HOME/zisk"
          echo "sha=$(git -C "$HOME/zisk" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "CARGO_ZISK=$HOME/zisk/target/release/cargo-zisk"
            echo "ZISKEMU=$HOME/zisk/target/release/ziskemu"
          } >> "$GITHUB_ENV"

      - name: "Cache ZisK emulator build"
        id: cache-emulator
        uses: actions/cache@v4
        with:
          path: |
            ~/zisk/target/release/cargo-zisk
            ~/zisk/target/release/ziskemu
          key: zisk-emulator-${{ runner.os }}-${{ steps.zisk.outputs.sha }}

      - name: "Build emulator (cargo-zisk + ziskemu)"
        if: steps.cache-emulator.outputs.cache-hit != 'true'
        run: |
          cd "$HOME/zisk"
          cargo build --release -p cargo-zisk -p ziskemu --bin cargo-zisk --bin ziskemu

      - name: "Install ZisK rust toolchain"
        run: |
          "$CARGO_ZISK" toolchain install
          rustup toolchain list | grep -q zisk || { echo "ERROR: ZisK toolchain not found after install."; exit 1; }

      # Copy the bench scripts out of the tree so they survive the base checkout
      # (the base branch may not contain them).
      - name: "Stash benchmark scripts"
        run: |
          cp .github/scripts/zec_bench.sh .github/scripts/zec_cycle_diff.py "$RUNNER_TEMP/"
          chmod +x "$RUNNER_TEMP/zec_bench.sh"

      - name: "Benchmark PR branch"
        run: bash "$RUNNER_TEMP/zec_bench.sh" "$RUNNER_TEMP/pr"

      - name: "Switch to base branch"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || inputs.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          git checkout --detach "origin/$BASE_REF"
          git clean -fdx -e target

      - name: "Benchmark base branch"
        run: bash "$RUNNER_TEMP/zec_bench.sh" "$RUNNER_TEMP/base"

      - name: "Build execution report"
        id: report
        run: |
          python3 "$RUNNER_TEMP/zec_cycle_diff.py" "$RUNNER_TEMP/base" "$RUNNER_TEMP/pr" > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'EXECUTION_REPORT<<__ZEC_EOF__'
            cat "$RUNNER_TEMP/report.md"
            echo '__ZEC_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: "Post / update PR comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          EXECUTION_REPORT: ${{ steps.report.outputs.EXECUTION_REPORT }}
        with:
          script: |
            const { EXECUTION_REPORT } = process.env;
            const marker = '<!-- zec-cycle-tracking -->';
            const body = `${marker}\n${EXECUTION_REPORT}`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
