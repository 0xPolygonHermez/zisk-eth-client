name: "Cycle Tracking"

on:
  pull_request:
    branches:
      - main
      - "develop-[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base branch to compare against (manual runs only)"
        required: false
        default: "main"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # ZISK_REF is resolved by the ./.github/actions/zisk-ref action.
  # Block inputs to test per client (from less MGs to more MGs).
  # It is good to have shared blocks between clients for easier comparison.
  RETH_TEST_BLOCKS: "25229957 25229955 25229951"
  ETHREX_TEST_BLOCKS: "25229957 25229955 25229951"

jobs:
  cycle-tracking:
    name: "Compare emulator cost vs base branch"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Free disk space"
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: "Checkout sources"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup dependencies"
        uses: ./.github/actions/setup-deps

      - name: "Resolve ZisK ref"
        uses: ./.github/actions/zisk-ref

      - name: "Clone ZisK"
        id: zisk
        run: |
          rm -rf "$HOME/zisk"
          git clone --depth 1 --branch "$ZISK_REF" https://github.com/0xPolygonHermez/zisk.git "$HOME/zisk"
          echo "sha=$(git -C "$HOME/zisk" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "CARGO_ZISK=$HOME/zisk/target/release/cargo-zisk"
            echo "ZISKEMU=$HOME/zisk/target/release/ziskemu"
          } >> "$GITHUB_ENV"

      - name: "Cache ZisK emulator build"
        id: cache-emulator
        uses: actions/cache@v4
        with:
          path: |
            ~/zisk/target/release/cargo-zisk
            ~/zisk/target/release/ziskemu
          key: zisk-emulator-${{ runner.os }}-${{ steps.zisk.outputs.sha }}

      - name: "Build emulator (cargo-zisk + ziskemu)"
        if: steps.cache-emulator.outputs.cache-hit != 'true'
        run: |
          cd "$HOME/zisk"
          cargo build --release -p cargo-zisk -p ziskemu --bin cargo-zisk --bin ziskemu

      - name: "Install ZisK rust toolchain"
        run: |
          "$CARGO_ZISK" toolchain install
          rustup toolchain list | grep -q zisk || { echo "ERROR: ZisK toolchain not found after install."; exit 1; }

      - name: "Benchmark PR branch"
        run: bash .github/scripts/zec_bench.sh "$RUNNER_TEMP/pr"

      - name: "Checkout base branch"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || inputs.base_ref }}
          path: base-tree

      - name: "Benchmark base branch"
        env:
          BENCH_REPO_DIR: ${{ github.workspace }}/base-tree
        run: bash .github/scripts/zec_bench.sh "$RUNNER_TEMP/base"

      - name: "Build execution report"
        id: report
        run: |
          python3 .github/scripts/zec_cycle_diff.py "$RUNNER_TEMP/base" "$RUNNER_TEMP/pr" > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'EXECUTION_REPORT<<__ZEC_EOF__'
            cat "$RUNNER_TEMP/report.md"
            echo '__ZEC_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: "Post / update PR comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          EXECUTION_REPORT: ${{ steps.report.outputs.EXECUTION_REPORT }}
        with:
          script: |
            const { EXECUTION_REPORT } = process.env;
            const marker = '<!-- zec-cycle-tracking -->';
            const body = `${marker}\n${EXECUTION_REPORT}`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
