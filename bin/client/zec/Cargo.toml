[workspace.package]

[package]
name = "zec"
description = "ZisK Ethereum Client"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
crypto = { path = "../../../crates/crypto" }

ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "feat/fix-new-patch" }
# Local development
# ziskos = { path = "../../../../../zisk/ziskos/entrypoint" }

# alloy
alloy-primitives = { version = "1.4.1", default-features = false, features = ["native-keccak"] }
alloy-consensus = { version = "1.1.2", default-features = false, features = ["crypto-backend"] }
alloy-genesis = { version = "1.1.2", default-features = false }

# mpt
sparsestate = { git = "https://github.com/eth-act/zkvm-ethereum-mpt.git", tag = "v0.4.0" }

# reth
reth-stateless = { git = "https://github.com/paradigmxyz/reth", rev = "cfde951976bfa9100a6d9f806e06fb539ae25241", default-features = false }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", rev = "cfde951976bfa9100a6d9f806e06fb539ae25241", default-features = false }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "cfde951976bfa9100a6d9f806e06fb539ae25241", default-features = false }

# revm
revm = { version = "33.1.0", default-features = false }

#ere
stateless-validator-common = { git = "https://github.com/eth-act/ere-guests.git" }
stateless-validator-reth = { git = "https://github.com/eth-act/ere-guests.git" }

# misc
bincode = "1.3.3"
serde = { version = "1.0", default-features = false }
serde_with = { version = "3", default-features = false }

[patch.crates-io]
# TODO: Decide what to do with the ruint patch
#       If included, it must be patched independently
# ruint = { git = "https://github.com/0xPolygonHermez/zisk-patch-ruint.git", branch = "zisk-patch/v1.17.2" } # TODO: Point to new tag when available
# Local development
# ruint = { path = "../../../../zisk-patch-ruint" }

# This patch removes "ring" as a dependency, that is not compatible with the ZisK toolchain
ethereum_hashing = { git = "https://github.com/jsign/ethereum_hashing", rev = "08c88633b700d7447ef840d19ce7b369c44311de" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zisk_hints)'] }