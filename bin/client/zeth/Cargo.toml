[package]
name = "zec-zeth"
description = ""
version = "0.4.0"
edition = "2021"

[workspace.package]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
bincode = "1.3.3"
revm = { version = "31.0.2", default-features = false }
alloy-consensus = { version = "1.0.37", default-features = false, features = ["crypto-backend"] }
alloy-primitives = { version = "1.5.0", default-features = false, features = ["native-keccak", "std", "map", "map-fxhash"] }

zeth-core = { git = "https://github.com/boundless-xyz/zeth.git", rev = "e8460d3e516fa01e45f00366b233d7d8e5cb8e67" }
zeth-chainspec = { git = "https://github.com/boundless-xyz/zeth.git", rev = "e8460d3e516fa01e45f00366b233d7d8e5cb8e67" }
# zeth-core = { path = "../../../../zeth/crates/core" }
# zeth-chainspec = { path = "../../../../zeth/crates/chainspec" }

crypto = { path = "../../../crates/crypto" }

# ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", tag = "v0.15.0" }
# Local development
ziskos = { path = "../../../../zisk/ziskos/entrypoint" }

[patch.crates-io]
# ruint = { git = "https://github.com/0xPolygonHermez/zisk-patch-ruint.git", branch = "zisk-patch/v1.17.2" } # TODO: Point to new tag when available
# tiny-keccak ={ git = "https://github.com/0xPolygonHermez/zisk-patch-tiny-keccak.git", tag = "patch-2.0.2-zisk-0.15.0" }
# Local development
# ruint = { path = "../../../../zisk-patch-ruint" }
tiny-keccak = { path = "../../../../zisk-patch-tiny-keccak" }

# Enable this for deterministic Hashmap sort
alloy-evm ={ path = "../../../../alloy-rs-evm/crates/evm" }
alloy-primitives = { path = "../../../../alloy-rs-core/crates/primitives" }

[patch."https://github.com/paradigmxyz/reth.git"]
# Enable this for deterministic Hashmap sort
reth-trie-common = { path = "../../../../reth/crates/trie/common" }
