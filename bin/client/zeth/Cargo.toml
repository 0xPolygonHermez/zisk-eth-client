[workspace.package]

[package]
name = "zec-zeth"
description = ""
version = "0.4.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
crypto = { path = "../../../crates/crypto" }

# ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "feat/fix-new-patch" }
# Local development
ziskos = { path = "../../../../../zisk/ziskos/entrypoint" }

# zeth
zeth-core = { git = "https://github.com/0xPolygonHermez/zisk-patch-zeth", branch = "zisk-hints" }
zeth-chainspec = { git = "https://github.com/0xPolygonHermez/zisk-patch-zeth", branch = "zisk-hints" }
# Local development
# zeth-core = { path = "../../../../zeth/crates/core" }
# zeth-chainspec = { path = "../../../../zeth/crates/chainspec" }

# alloy
alloy-primitives = { version = "1.5.4", default-features = false, features = ["native-keccak"] }
alloy-consensus = { version = "1.6.0", default-features = false, features = ["crypto-backend"] }

# revm
revm = { version = "33.1.0", default-features = false }

# misc
bincode = "1.3.3"

[patch.crates-io]
# TODO: Remove the k256 patch when the new injected reth features are released
k256 = { git = "https://github.com/0xPolygonHermez/zisk-patch-elliptic-curves.git", tag = "patch-k256-0.13.4-zisk-0.15.0" }
# k256 = { path = "../../../../zisk-patch-k256/k256" }

# TODO: Decide what to do with the ruint patch
#       If included, it must be patched independently
# ruint = { git = "https://github.com/0xPolygonHermez/zisk-patch-ruint.git", branch = "zisk-patch/v1.17.2" } # TODO: Point to new tag when available
# Local development
# ruint = { path = "../../../../zisk-patch-ruint" }

# Enable this for deterministic Hashmap sort
alloy-evm = { git = "https://github.com/0xPolygonHermez/zisk-patch-alloy-evm.git", branch = "zisk-hints" }
# Local development
# alloy-evm = { path = "../../../../alloy-rs-evm/crates/evm" }

[patch."https://github.com/paradigmxyz/reth.git"]
# Enable this for deterministic Hashmap sort
reth-trie-common = { git = "https://github.com/0xPolygonHermez/zisk-patch-reth.git", branch = "zisk-hints"}
# Local development
# reth-trie-common = { path = "../../../../zisk-patch-reth/crates/trie/common" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zisk_hints)'] }
