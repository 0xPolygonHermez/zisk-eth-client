[package]
name = "zec-rsp"
description = ""
version = "0.4.0"
edition = "2021"

[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
bincode = "1.3.3"
revm = { version = "31.0.2", default-features = false }
alloy-consensus = { version = "1.4.3", default-features = false, features = ["crypto-backend"] }
alloy-primitives = { version = "1.5.2", default-features = false, features = ["native-keccak"] }

# rsp-client-executor = { git = "https://github.com/succinctlabs/rsp.git", rev = "31e077b1039c32a8c028570bb9b82645dda155cc" }
# Remove the following if PR https://github.com/succinctlabs/rsp/pull/169 is merged
rsp-client-executor = { git = "https://github.com/hecmas/rsp.git", branch = "feat/dynamic-keccak", default-features = false, features = ["native-keccak"] }

crypto = { path = "../../../crates/crypto" }

# ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", tag = "v0.15.0" }
# Local development
ziskos = { path = "../../../../../zisk/ziskos/entrypoint" }

[patch.crates-io]
sp1_bls12_381 = { git = "https://github.com/0xPolygonHermez/zisk-patch-bls12-381.git", tag = "patch-0.8.0-zisk-0.11.0" } # Needed for rsp symbol linking

ruint = { git = "https://github.com/0xPolygonHermez/zisk-patch-ruint.git", tag = "patch-1.17.0-zisk-0.15.0" }
# Local development
# ruint = { path = "../../../../zisk-patch-ruint" }