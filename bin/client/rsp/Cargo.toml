[package]
name = "zec-rsp"
description = ""
version = "0.4.0"
edition = "2021"

[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
bincode = "1.3.3"
revm = { version = "31.0.2", default-features = false }
alloy-consensus = { version = "1.4.3", default-features = false, features = ["crypto-backend"] }
alloy-primitives = { version = "1.5.2", default-features = false, features = ["native-keccak"] }

rsp-client-executor = { git = "https://github.com/succinctlabs/rsp.git", rev = "af7c7e76b4853dc8bdfcd0af9f0ab527f7430608", default-features = false, features = ["native-keccak"] }

crypto = { path = "../../../crates/crypto" }

ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "feat/fix-new-patch" }
# Local development
# ziskos = { path = "../../../../../zisk/ziskos/entrypoint" }

[patch.crates-io]
sp1_bls12_381 = { git = "https://github.com/0xPolygonHermez/zisk-patch-bls12-381.git", tag = "patch-0.8.0-zisk-0.11.0" } # Needed for rsp symbol linking

ruint = { git = "https://github.com/0xPolygonHermez/zisk-patch-ruint.git", tag = "patch-1.17.0-zisk-0.15.0" }
# Local development
# ruint = { path = "../../../../zisk-patch-ruint" }