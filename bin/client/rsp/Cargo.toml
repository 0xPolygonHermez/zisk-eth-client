[package]
name = "zec-rsp"
description = ""
version = "0.4.0"
edition = "2021"

[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
bincode = "1.3.3"
revm = { version = "31.0.2", default-features = false }
alloy-consensus = { version = "1.0.37", default-features = false, features = ["crypto-backend"] }

rsp-client-executor = { git = "https://github.com/succinctlabs/rsp.git", rev = "dff5c97aecab8dd33b70cf5b575904858a78efc3" }
# rsp-client-executor = { path = "../../../../rsp/crates/executor/client" }

crypto = { path = "../../../crates/crypto" }

# ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", tag = "v0.15.0" }
# Local development
ziskos = { path = "../../../../../zisk/ziskos/entrypoint" }

[patch.crates-io]
sp1_bls12_381 = { git = "https://github.com/0xPolygonHermez/zisk-patch-bls12-381.git", tag = "patch-0.8.0-zisk-0.11.0" } # Needed for rsp symbol linking

ruint = { git = "https://github.com/0xPolygonHermez/zisk-patch-ruint.git", tag = "patch-1.17.0-zisk-0.15.0" }
sha3 = { git = "https://github.com/0xPolygonHermez/zisk-patch-hashes.git", tag = "patch-sha3-0.10.8-zisk-0.15.0" }
# Local development
# ruint = { path = "../../../../zisk-patch-ruint" }
# sha3 = { path = "../../../../zisk-patch-sha3/sha3" }