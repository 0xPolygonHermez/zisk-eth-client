[workspace.package]

[package]
name = "zec-reth"
description = "ZisK Ethereum Client Stateless Validator Reth"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
crypto = { path = "../../../crates/crypto" }

# ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "pre-develop-0.16.0" }
# Local development
ziskos = { path = "../../../../../zisk/ziskos/entrypoint" }

# alloy
alloy-primitives = { version = "1.5.4", default-features = false, features = ["native-keccak"] }
alloy-consensus = { version = "1.6.0", default-features = false, features = ["crypto-backend"] }
alloy-genesis = { version = "1.6.0", default-features = false }

# reth
reth-stateless = { git = "https://github.com/paradigmxyz/reth", tag = "v1.10.2", default-features = false }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v1.10.2", default-features = false }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v1.10.2", default-features = false }

# revm
revm = { version = "34.0.0", default-features = false }

# mpt
sparsestate = { git = "https://github.com/eth-act/zkvm-ethereum-mpt.git", rev = "a1e44638c49c4e16751a0b915593fce98ab6bdef" }

#ere
stateless-validator-common = { git = "https://github.com/eth-act/ere-guests.git", rev = "c696d4bb8073190208a481174b48781544052c4d" }
stateless-validator-reth = { git = "https://github.com/eth-act/ere-guests.git", rev = "c696d4bb8073190208a481174b48781544052c4d" }

# misc
bincode = "1.3.3"

[patch.crates-io]
# This patch removes "ring" as a dependency, that is not compatible with the ZisK toolchain
ethereum_hashing = { git = "https://github.com/jsign/ethereum_hashing", rev = "08c88633b700d7447ef840d19ce7b369c44311de" }

[patch."https://github.com/paradigmxyz/reth.git"]
reth-stateless = { git = "https://github.com/0xPolygonHermez/zisk-patch-reth.git", branch = "chore/clean-brec-up" }
reth-chainspec = { git = "https://github.com/0xPolygonHermez/zisk-patch-reth.git", branch = "chore/clean-brec-up" }
reth-evm-ethereum = { git = "https://github.com/0xPolygonHermez/zisk-patch-reth.git", branch = "chore/clean-brec-up" }
# The following are needed for compilation
reth-errors = { git = "https://github.com/0xPolygonHermez/zisk-patch-reth.git", branch = "chore/clean-brec-up" }
reth-trie-common = { git = "https://github.com/0xPolygonHermez/zisk-patch-reth.git", branch = "chore/clean-brec-up" }
# local
# reth-stateless = { path = "../../../../zisk-patch-reth/crates/stateless" }
# reth-chainspec = { path = "../../../../zisk-patch-reth/crates/chainspec" }
# reth-evm-ethereum = { path = "../../../../zisk-patch-reth/crates/ethereum/evm" }
# # The following are needed for compilation
# reth-errors = { path = "../../../../zisk-patch-reth/crates/errors" }
# reth-trie-common = { path = "../../../../zisk-patch-reth/crates/trie/common" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zisk_hints)'] }