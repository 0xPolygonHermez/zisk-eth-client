[workspace.package]

[package]
name = "zec-reth"
description = "ZisK Ethereum Client Stateless Validator Reth"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
# revm
revm = { version = "34.0.0", default-features = false }

# alloy
alloy-consensus = { version = "1.6.0", default-features = false, features = ["crypto-backend"] }
alloy-primitives = { version = "1.5.4", default-features = false, features = ["native-keccak"] }

#ere
stateless-validator-reth = { git = "https://github.com/eth-act/ere-guests.git", rev = "c696d4bb8073190208a481174b48781544052c4d" }

# ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "feat/k256-ecdsa-ver" }
# Local development
ziskos = { path = "../../../zisk/ziskos/entrypoint" }

crypto = { path = "../../crates/crypto" }
guest = { path = "../../crates/guest" }

[patch.crates-io]
# This patch removes "ring" as a dependency, that is not compatible with the ZisK toolchain
ethereum_hashing = { git = "https://github.com/jsign/ethereum_hashing", rev = "08c88633b700d7447ef840d19ce7b369c44311de" }

# Enable this for deterministic Hashmap sort
alloy-evm = { git = "https://github.com/0xPolygonHermez/zisk-patch-alloy-evm.git", branch = "zisk-hints/v0.27.2" }
# Local development
# alloy-evm = { path = "../../../zisk-patch-alloy-evm/crates/evm" }

# TODO: This can be removed when a new version of reth is released
[patch."https://github.com/paradigmxyz/reth.git"]
reth-stateless = { git = "https://github.com/0xPolygonHermez/zisk-patch-reth.git", branch = "zisk-hints/v1.10.2" }
reth-chainspec = { git = "https://github.com/0xPolygonHermez/zisk-patch-reth.git", branch = "zisk-hints/v1.10.2" }
reth-evm-ethereum = { git = "https://github.com/0xPolygonHermez/zisk-patch-reth.git", branch = "zisk-hints/v1.10.2" }
# Needed for compilation
reth-errors = { git = "https://github.com/0xPolygonHermez/zisk-patch-reth.git", branch = "zisk-hints/v1.10.2" }
# Needed for compilation and deterministic Hashmap sort
reth-trie-common = { git = "https://github.com/0xPolygonHermez/zisk-patch-reth.git", branch = "zisk-hints/v1.10.2" }
# Local development
# reth-stateless = { path = "../../../zisk-patch-reth/crates/stateless" }
# reth-chainspec = { path = "../../../zisk-patch-reth/crates/chainspec" }
# reth-evm-ethereum = { path = "../../../zisk-patch-reth/crates/ethereum/evm" }
# # Needed for compilation
# reth-errors = { path = "../../../zisk-patch-reth/crates/errors" }
# # Needed for compilation and deterministic Hashmap sort
# reth-trie-common = { path = "../../../zisk-patch-reth/crates/trie/common" }

[patch."https://github.com/eth-act/zkvm-ethereum-mpt.git"]
sparsestate = { git = "https://github.com/0xPolygonHermez/zisk-patch-zkvm-ethereum-mpt.git", branch = "zisk-hints/v0.4.0" }
# Local development
# sparsestate = { path = "../../../zisk-patch-zkvm-ethereum-mpt/crates/sparsestate" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zisk_hints)'] }