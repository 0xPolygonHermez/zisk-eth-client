[package]
name = "host"
description = "ZisK Ethereum Client Host"
version = "0.1.0"
edition = "2024"

[features]
# ziskethone client. Off by default. Mirrors `input`'s own split: selecting the
# client needs no C++ — only the native `run()` FFI does, and that is reached
# solely via `--gen-hints` (execute/verify-constraints never call it, and
# `emits_hints()` is false for this client anyway). Kept separate so an
# execute/prove run builds on a box without clang >= 15 / libstdc++ >= 12.
ziskethone = ["input/ziskethone"]
# The above plus the native C++ `run()` FFI (needs clang >= 15 / g++ >= 12).
ziskethone-native-ffi = ["ziskethone", "input/ziskethone-native-ffi"]

[dependencies]
# Not `workspace = true`: Cargo doesn't allow a member to override
# `default-features` on an inherited workspace dependency, and this crate needs
# `default-features = false` to make `ziskethone` (below) an actual toggle
# rather than a no-op against input's own defaults.
input = { path = "../../crates/input", default-features = false, features = ["cli", "reth", "ethrex"] }
guest-ziskethone.workspace = true
zisk-sdk.workspace = true
ziskos.workspace = true

anyhow.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[build-dependencies]
zisk-sdk.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zisk_hints)'] }
