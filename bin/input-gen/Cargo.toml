[package]
name = "input-gen"
description = "ZisK Ethereum Client - Input generator binary (thin wrapper around input-gen-lib)"
version.workspace = true
edition.workspace = true

[dependencies]
input-gen-lib = { path = "../../crates/input-gen" }

anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[features]
# Opt into the ziskethone client (pulls the C++ FFI guest); mirrors how `host`
# exposed it. Off by default so a plain `input-gen` build stays toolchain-free.
ziskethone = ["input-gen-lib/ziskethone"]
