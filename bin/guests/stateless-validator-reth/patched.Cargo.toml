[workspace.package]

[package]
name = "zec-reth"
description = "ZisK Ethereum Client Stateless Validator Reth"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
guest-reth = { path = "../../../crates/guest-reth" }

# ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "pre-develop-0.17.0" }
# Local development
ziskos = { path = "../../../../../zisk/ziskos/entrypoint" }

# alloy
alloy-consensus = { version = "1.7.3", default-features = false }
alloy-primitives = { version = "1.5.6", features = [
  "sha3-keccak",
] } # Needed for ZisK-accelerated keccak:
#    - native-keccak: inject keccak through linker
#    - tiny-keccak: inject keccak through tiny-keccak lib
#    - sha3-keccak: inject keccak through sha3 lib

# revm
revm = { version = "34.0.0", default-features = false, features = [
  "std",
  "blst",
  "portable",
  "bn",
] }

# Needed for deterministic Hashmap sort
alloy-evm = { git = "https://github.com/0xPolygonHermez/zisk-patch-alloy-evm.git", branch = "zisk-hints/v0.27.3" }
# alloy-evm = { path = "../../../zisk-patch-alloy-evm/crates/evm" }

[patch."https://github.com/paradigmxyz/reth.git"]
# Needed for deterministic Hashmap sort
reth-trie-common = { git = "https://github.com/0xPolygonHermez/zisk-patch-reth.git", branch = "zisk-hints/v1.11.0" }
# reth-trie-common = { path = "../../../zisk-patch-reth/crates/trie/common" }

[patch."https://github.com/paradigmxyz/stateless.git"]
# Needed for function visibility and deterministic Hashmap sort
stateless = { git = "https://github.com/0xPolygonHermez/zisk-patch-stateless.git", branch = "zisk/ed189a5" }
tries = { git = "https://github.com/0xPolygonHermez/zisk-patch-stateless.git", branch = "zisk/ed189a5" }
# stateless = { path = "../zisk-patch-stateless/crates/stateless" }
# tries = { path = "../zisk-patch-stateless/crates/tries" }

[patch.crates-io]
# ruint = { git = "https://github.com/0xPolygonHermez/zisk-patch-ruint.git", tag = "patch-1.17.0-zisk-0.15.0" }
# sha2 = { git = "https://github.com/0xPolygonHermez/zisk-patch-hashes.git", tag = "patch-sha2-0.10.9-zisk-0.15.0" }
# sha3 = { git = "https://github.com/0xPolygonHermez/zisk-patch-hashes.git", tag = "patch-sha3-0.10.8-zisk-0.15.0" }
# tiny-keccak ={ git = "https://github.com/0xPolygonHermez/zisk-patch-tiny-keccak.git", tag = "patch-2.0.2-zisk-0.15.0" }
# k256 = { git = "https://github.com/0xPolygonHermez/zisk-patch-elliptic-curves.git", tag = "patch-k256-0.13.4-zisk-0.15.0" }
# substrate-bn = { git = "https://github.com/0xPolygonHermez/zisk-patch-bn.git", tag = "patch-0.6.0-zisk-0.15.0" }
# blst = { git = "https://github.com/0xPolygonHermez/zisk-patch-blst.git", tag = "patch-0.3.15-zisk-0.15.0" }
# aurora-engine-modexp = { git = "https://github.com/0xPolygonHermez/zisk-patch-modexp.git", tag = "patch-1.2.0-zisk-0.15.0" }
# Local development
# ruint = { path = "../../../../../shit/zisk-patch-ruint" }
sha2 = { path = "../../../../../shit/zisk-patch-sha2/sha2" }
sha3 = { path = "../../../../../shit/zisk-patch-sha3/sha3" }
tiny-keccak = { path = "../../../../../shit/zisk-patch-tiny-keccak" }
k256 = { path = "../../../../../shit/zisk-patch-k256/k256" }
substrate-bn = { path = "../../../../../shit/zisk-patch-bn" }
blst = { path = "../../../../../shit/zisk-patch-bls/bindings/rust" }
aurora-engine-modexp = { path = "../../../../../shit/zisk-patch-modexp/engine-modexp" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zisk_hints)'] }
