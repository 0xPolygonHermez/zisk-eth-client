[workspace.package]

[package]
name = "zec-reth"
description = "ZisK Ethereum Client Stateless Validator Reth"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
guest-reth = { path = "../../../crates/guest-reth" }

ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "feature/recurser-1.0.0-beta-merge" }
# Local development
# ziskos = { path = "../../../../zisk/ziskos/entrypoint" }

# alloy
alloy-consensus = { version = "2.0.0", default-features = false }
alloy-primitives = { version = "1.5.6", features = ["native-keccak"] }

# revm
revm = { version = "38.0.0", default-features = false }

# Needed for deterministic Hashmap sort
alloy-evm = { git = "https://github.com/0xPolygonHermez/zisk-patch-alloy-evm.git", branch = "zisk-hints/v0.33.3" }
# alloy-evm = { path = "../../../zisk-patch-alloy-evm/crates/evm" }

[patch."https://github.com/paradigmxyz/reth.git"]
# Needed for deterministic Hashmap sort
reth-trie-common = { git = "https://github.com/0xPolygonHermez/zisk-patch-reth.git", branch = "zisk-hints/v2.1.0" }
# reth-trie-common = { path = "../../../zisk-patch-reth/crates/trie/common" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zisk_hints)'] }
