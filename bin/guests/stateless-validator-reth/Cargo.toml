[workspace.package]

[package]
name = "zec-reth"
description = "ZisK Ethereum Client Stateless Validator Reth"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
guest-reth = { path = "../../../crates/guest-reth" }

ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "ziskos-enlarge" }
# Local development
# ziskos = { path = "../../../../zisk/ziskos/entrypoint" }

# alloy
alloy-consensus = { version = "1.7.3", default-features = false }
alloy-primitives = { version = "1.5.6", features = ["native-keccak"] } # Needed for ZisK-accelerated keccak

# revm
revm = { version = "34.0.0", default-features = false }

# Needed for deterministic Hashmap sort + U256 type compatibility with revm fork
alloy-evm = { git = "https://github.com/eth-act/zisk-patch-alloy-evm.git", branch = "feature/switchable-u256-backend" }

[patch.crates-io]
revm = { git = "https://github.com/eth-act/revm.git", branch = "feature/switchable-u256-backend-by-conditional-compilation-v34.0.0" }
revm-bytecode = { git = "https://github.com/eth-act/revm.git", branch = "feature/switchable-u256-backend-by-conditional-compilation-v34.0.0" }
revm-context = { git = "https://github.com/eth-act/revm.git", branch = "feature/switchable-u256-backend-by-conditional-compilation-v34.0.0" }
revm-database = { git = "https://github.com/eth-act/revm.git", branch = "feature/switchable-u256-backend-by-conditional-compilation-v34.0.0" }
revm-handler = { git = "https://github.com/eth-act/revm.git", branch = "feature/switchable-u256-backend-by-conditional-compilation-v34.0.0" }
revm-inspector = { git = "https://github.com/eth-act/revm.git", branch = "feature/switchable-u256-backend-by-conditional-compilation-v34.0.0" }
revm-interpreter = { git = "https://github.com/eth-act/revm.git", branch = "feature/switchable-u256-backend-by-conditional-compilation-v34.0.0" }
revm-precompile = { git = "https://github.com/eth-act/revm.git", branch = "feature/switchable-u256-backend-by-conditional-compilation-v34.0.0" }
revm-primitives = { git = "https://github.com/eth-act/revm.git", branch = "feature/switchable-u256-backend-by-conditional-compilation-v34.0.0" }
revm-state = { git = "https://github.com/eth-act/revm.git", branch = "feature/switchable-u256-backend-by-conditional-compilation-v34.0.0" }
revm-database-interface = { git = "https://github.com/eth-act/revm.git", branch = "feature/switchable-u256-backend-by-conditional-compilation-v34.0.0" }
revm-context-interface = { git = "https://github.com/eth-act/revm.git", branch = "feature/switchable-u256-backend-by-conditional-compilation-v34.0.0" }
alloy-evm = { git = "https://github.com/eth-act/zisk-patch-alloy-evm.git", branch = "feature/switchable-u256-backend" }

[patch."https://github.com/paradigmxyz/reth.git"]
# Needed for deterministic Hashmap sort + U256 type compatibility with revm fork
reth-trie-common = { git = "https://github.com/eth-act/zisk-patch-reth.git", branch = "feature/switchable-u256-backend" }
reth-primitives-traits = { git = "https://github.com/eth-act/zisk-patch-reth.git", branch = "feature/switchable-u256-backend" }
reth-execution-types = { git = "https://github.com/eth-act/zisk-patch-reth.git", branch = "feature/switchable-u256-backend" }
reth-evm = { git = "https://github.com/eth-act/zisk-patch-reth.git", branch = "feature/switchable-u256-backend" }
reth-evm-ethereum = { git = "https://github.com/eth-act/zisk-patch-reth.git", branch = "feature/switchable-u256-backend" }
reth-ethereum-forks = { git = "https://github.com/eth-act/zisk-patch-reth.git", branch = "feature/switchable-u256-backend" }
reth-chainspec = { git = "https://github.com/eth-act/zisk-patch-reth.git", branch = "feature/switchable-u256-backend" }
# Needed so serde feature unification works when reth-execution-types is patched
reth-ethereum-primitives = { git = "https://github.com/eth-act/zisk-patch-reth.git", branch = "feature/switchable-u256-backend" }

[patch."https://github.com/0xPolygonHermez/zisk-patch-reth.git"]
reth-primitives-traits = { git = "https://github.com/eth-act/zisk-patch-reth.git", branch = "feature/switchable-u256-backend" }
reth-ethereum-primitives = { git = "https://github.com/eth-act/zisk-patch-reth.git", branch = "feature/switchable-u256-backend" }

[patch."https://github.com/paradigmxyz/stateless.git"]
stateless = { git = "https://github.com/eth-act/zisk-patch-stateless.git", branch = "feature/switchable-u256-backend" }
tries = { git = "https://github.com/eth-act/zisk-patch-stateless.git", branch = "feature/switchable-u256-backend" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zisk_hints)'] }
