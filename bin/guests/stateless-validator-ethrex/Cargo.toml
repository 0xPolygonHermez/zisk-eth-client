[workspace.package]

[package]
name = "zec-ethrex"
description = "ZisK Ethereum Client Stateless Validator Ethrex"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
guest-common = { path = "../../../crates/guest-common" }
guest-ethrex = { path = "../../../crates/guest-ethrex" }

ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "pre-develop-0.16.0" }
# Local development
# ziskos = { path = "../../../zisk/ziskos/entrypoint" }

# eth-act
stateless-validator-ethrex = { git = "https://github.com/eth-act/ere-guests.git", rev = "40006b91edcf0b73f021988f982aea0bbec5039a", default-features =  false, features = [
    "std",
] }
ere-io = { git = "https://github.com/eth-act/ere", tag = "v0.3.0" }

[patch.crates-io]
# Needed to remove "ring" as a dependency, that is not compatible with the ZisK toolchain
ethereum_hashing = { git = "https://github.com/jsign/ethereum_hashing", rev = "08c88633b700d7447ef840d19ce7b369c44311de" }

# Needed to remove the sp1_bls12_381 symbol dependency from ehtrex
sp1_bls12_381 = { git = "https://github.com/0xPolygonHermez/zisk-patch-bls12-381", branch = "zisk-patch/v0.8.0-sp1-6.0.0" }
# sp1_bls12_381 = { path = "../../../../zisk-patch-bls12-381" }