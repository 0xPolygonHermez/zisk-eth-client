[workspace.package]

[package]
name = "zec-ethrex"
description = "ZisK Ethereum Client Stateless Validator Ethrex"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
guest-ethrex = { path = "../../../crates/guest-ethrex" }

# ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "pre-develop-0.17.1" }
ziskos = { git = "https://github.com/eth-act/zisk.git", branch = "feature/no-std-compatibility" }
# ziskos = { path = "../../../../zisk/ziskos/entrypoint" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zisk_hints)'] }
