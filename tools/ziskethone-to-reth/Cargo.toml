[package]
name = "ziskethone-to-reth"
description = "Transcode ziskethone ZEG0 inputs back into reth stateless-validator inputs"
version.workspace = true
edition.workspace = true

# A workspace member (unlike tools/reth-to-ziskethone, which is detached): this
# tool produces stateless inputs through input-reth.

[dependencies]
input-reth.workspace = true
stateless-validator-common = { workspace = true, features = ["std"] }

alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-rlp.workspace = true
alloy-rpc-types-debug.workspace = true

anyhow.workspace = true
clap.workspace = true
tiny-keccak.workspace = true
tokio = { workspace = true, features = ["macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
