[package]
name = "ziskethone-to-reth"
description = "Transcode ziskethone ZEG0 inputs back into reth stateless-validator inputs"
version.workspace = true
edition.workspace = true

# A workspace member: it produces reth types, so it needs guest-reth /
# stateless-reth from the workspace.

[dependencies]
input-core.workspace = true
input-reth.workspace = true
stateless-reth.workspace = true
zisk-sdk.workspace = true

alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-rlp.workspace = true

reth-chainspec.workspace = true
reth-ethereum-primitives.workspace = true

anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
