[package]
name = "migrate-inputs"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "migrate-inputs"
path = "src/main.rs"

[dependencies]
# OLD deps — pinned to what produced the legacy .bin files.
alloy-consensus = { version = "1.7.3", default-features = false }
alloy-genesis = "1.7.3"
alloy-primitives = "1.5.6"
alloy-rlp = "0.3"

reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v1.11.0", features = [
  "serde",
  "serde-bincode-compat",
] }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth", tag = "v1.11.0", features = [
  "serde",
  "serde-bincode-compat",
] }

anyhow = "1.0"
bincode = { version = "2.0", default-features = false, features = [
  "serde",
  "std",
] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_with = "3.14"
