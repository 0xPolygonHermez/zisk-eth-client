[package]
name = "reth-to-ziskethone"
description = "Transcode reth stateless-validator inputs into ziskethone ZEG0 inputs (offline)"
version.workspace = true
edition.workspace = true
publish = false

# A workspace member: it validates and re-executes the block with reth to learn
# which accounts and slots it accesses, so it needs the workspace's reth crates.

[dependencies]
input-reth.workspace = true
rust-input-gen.workspace = true
zisk-sdk.workspace = true
stateless-reth.workspace = true
stateless-reth-tries.workspace = true

alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true

reth-evm-ethereum.workspace = true
reth-ethereum-primitives.workspace = true
revm.workspace = true
reth-evm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.1.0", default-features = false }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.1.0", default-features = false }

anyhow.workspace = true
clap.workspace = true
tracing-subscriber.workspace = true
