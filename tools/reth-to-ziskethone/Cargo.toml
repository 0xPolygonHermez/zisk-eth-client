[package]
name = "reth-to-ziskethone"
version = "0.1.0"
edition = "2021"
publish = false

# Detached from the root workspace: this tool lives in the alloy-2.x world that
# `rust-input-gen` uses, independent of the workspace's reth/alloy-1.x deps. It
# never touches reth types — it decodes the committed reth `.bin` purely via
# bincode + RLP into alloy consensus types.
[workspace]

[[bin]]
name = "reth-to-ziskethone"
path = "src/main.rs"

[dependencies]
# The pure ZEG0 encoder + its OfflineSources/ExecutionWitness types. Path dep on
# the pinned ziskethone submodule; must use the SAME alloy version as below so
# the `alloy::rpc::types::Block` we build unifies with the one `encode_binary`
# expects.
rust-input-gen = { path = "../../third_party/ziskethone/rust-input-gen" }

alloy = { version = "2.0", features = ["consensus", "eips", "rpc-types-eth"] }
alloy-primitives = "1"
alloy-rlp = "0.3"

anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2.0", default-features = false, features = ["serde", "std"] }
