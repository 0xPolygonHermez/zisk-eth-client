[package]
name = "guest-reth"
description = ""
version.workspace = true
edition.workspace = true

[features]
default = ["std"]
std = [
    "dep:rayon",
    "revm/std",
    "anyhow/std",
    "bincode/std",
    "serde/std",
    "serde_with/std",
    "k256/std",
    "alloy-consensus/std",
    "alloy-genesis/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
]

[dependencies]
guest-common.workspace = true
ziskos.workspace = true

# Use direct dep for bincode to avoid workspace's "std" feature being force-merged.
bincode = { version = "2.0", default-features = false, features = ["serde", "alloc"] }
anyhow = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
serde_with = { workspace = true, default-features = false, features = ["macros", "alloc"] }
rayon = { workspace = true, optional = true }
revm = { workspace = true }
k256 = { workspace = true, default-features = false, features = ["alloc", "ecdsa"] }
tiny-keccak = { workspace = true }

alloy-consensus = { workspace = true, default-features = false, features = [
  "crypto-backend",
  "k256",
] }
alloy-genesis.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-rpc-types-debug.workspace = true

reth-chainspec = { workspace = true, default-features = false }
reth-ethereum-primitives = { workspace = true, default-features = false }
reth-primitives-traits = { workspace = true, default-features = false }
reth-evm-ethereum = { workspace = true, default-features = false }

stateless-reth = { workspace = true, default-features = false }
stateless-reth-tries = { workspace = true, default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_vendor, values("zisk"))',
  'cfg(zisk_hints)',
  'cfg(zisk_hints_debug)',
] }
