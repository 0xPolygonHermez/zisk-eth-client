[package]
name = "guest-reth"
description = "ZisK guest for the reth stateless validator (execution-specs stateless I/O)"
version.workspace = true
edition.workspace = true

[dependencies]
guest-common.workspace = true
ziskos.workspace = true

tiny-keccak.workspace = true

alloy-consensus = { workspace = true, default-features = false, features = [
  "crypto-backend",
  "k256",
] }
alloy-primitives.workspace = true

revm.workspace = true

# `zkvm-interface` makes the validator hash SSZ (the EIP-8025 payload root)
# through the standard zkVM C interface, whose `zkvm_sha256` symbol ziskos
# provides (the ZisK precompile on the guest, software natively). Without it
# the SSZ merkleization runs SHA-256 in software: ~5M extra steps per block.
# Only the hasher is affected; the crypto provider stays `CustomEvmCrypto`.
stateless-validator-reth = { workspace = true, features = ["zkvm-interface"] }
stateless-validator-common.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_vendor, values("zisk"))',
  'cfg(zisk_hints)',
  'cfg(zisk_hints_debug)',
] }
