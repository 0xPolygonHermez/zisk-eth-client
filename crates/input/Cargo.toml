[package]
name = "input"
description = ""
version.workspace = true
edition.workspace = true

[dependencies]
input-core.workspace = true
input-reth = { workspace = true, optional = true }
input-ethrex = { workspace = true, optional = true }
input-ziskethone = { workspace = true, optional = true }

clap = { workspace = true, optional = true }

[features]
# Only `reth` is on by default — the primary client — so `input` stays lean for
# consumers that just want reth. Enable `ethrex` / `ziskethone` explicitly (e.g.
# `host` lists reth+ethrex; opt into ziskethone with `--features ziskethone`).
#
# `ziskethone` is kept out of the default because it transitively builds
# guest-ziskethone's native C++ FFI (clang >= 15 / g++ >= 12 + the submodule), so
# a default build stays toolchain-free. It also avoids a feature-unification
# trap: were it default-on, `--workspace` would enable the `Client::ZiskEthOne`
# variant workspace-wide while a consumer like `host` (ziskethone off) leaves its
# match arm `#[cfg]`-gated out — a non-exhaustive match. Each client's enum
# variant / re-export is feature-gated, so a consumer's `create_client` arms must
# match exactly the features it enables.
default = ["reth"]
cli = ["dep:clap"]
reth = ["dep:input-reth"]
ethrex = ["dep:input-ethrex"]
ziskethone = ["dep:input-ziskethone"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zisk_hints)'] }
