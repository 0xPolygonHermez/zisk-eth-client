[package]
name = "guest-ziskethone"
description = "ziskethone C++ EVM integration"
version.workspace = true
edition.workspace = true

[features]
# Compile + link the native `zeg_run` FFI (`run`). OFF by default: the committed
# guest ELF (`ELF`) needs no C++ toolchain, so proving-only consumers depend on
# this crate with nothing installed. Enable to build the evmone-based host EVM
# (needs clang >= 15 / g++ >= 12 and the ziskethone submodule).
ziskethone = []

# Regenerate the committed guest ELF (crates/guest-ziskethone/elf/) from the
# ziskethone C++ sources. OFF by default: normal builds embed the checked-in ELF
# and need no ziskethone submodule and no xPack RISC-V toolchain. Turn it on only
# when you've changed the C++ guest and want to rebuild + re-commit the ELF.
rebuild-guest = []

[dependencies]
zisk-sdk.workspace = true

[build-dependencies]
blake3 = "1.5"
cmake = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zisk_skip_guest_build)'] }
