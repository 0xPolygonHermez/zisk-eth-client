[workspace]
members = [
    "bin/host",
    "bin/hints-gen",
    "bin/input-gen",
    "crates/input",
    "crates/input-gen",
    "crates/common/*",
    # Each client is a pair of crates: crates/clients/<client>/{guest,input}.
    # The glob requires that two-level nesting — a crate placed directly at
    # crates/clients/<client>/ is silently NOT a workspace member.
    "crates/clients/*/*",
    "tests",
    "tools/ziskethone-to-reth",
]
exclude = ["tools/migrate-inputs", "third_party/ziskethone/rust-input-gen"]
resolver = "2"

[workspace.package]
version = "0.10.0"
edition = "2021"

[workspace.dependencies]
guest-common = { path = "crates/common/guest-common" }
guest-ethrex = { path = "crates/clients/ethrex/guest" }
guest-reth = { path = "crates/clients/reth/guest" }
guest-ziskethone = { path = "crates/clients/ziskethone/guest" }
input = { path = "crates/input" }
input-core = { path = "crates/common/input-core" }
input-ethrex = { path = "crates/clients/ethrex/input" }
input-reth = { path = "crates/clients/reth/input" }
input-ziskethone = { path = "crates/clients/ziskethone/input" }
rust-input-gen = { path = "third_party/ziskethone/rust-input-gen" }

zisk-sdk = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "pre-develop-1.4.0-alpha" }
zisk-zkvm-interface = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "pre-develop-1.4.0-alpha" }
ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "pre-develop-1.4.0-alpha" }

# crates.io dependencies
# zisk-sdk = "1.4.0-alpha"
# zisk-zkvm-interface = "1.4.0-alpha"
# ziskos = "1.4.0-alpha"

# Local development
# zisk-sdk = { path = "../zisk/sdk" }
# zisk-zkvm-interface = { path = "../zisk/zkvm-interface" }
# ziskos = { path = "../zisk/ziskos/entrypoint" }

revm = { version = "43.0.3", default-features = false }

# types (for reth)
alloy-rlp = "0.3"
alloy-primitives = "1.6.1"
alloy = "2.5.0"
alloy-consensus = { version = "2.5.0", default-features = false }
alloy-json-rpc = "2.5.0"
alloy-provider = "2.5.0"
alloy-rpc-client = "2.5.0"
alloy-transport = "2.5.0"
alloy-transport-http = { version = "2.5.0", features = ["reqwest"] }
alloy-genesis = "2.5.0"
alloy-eips = "2.5.0"
alloy-rpc-types-eth = "2.5.0"
alloy-rpc-types-debug = "2.5.0"

# reth stateless validator (paradigmxyz/stateless). All reth-* crates enter the
# graph through these two, pinned to the reth rev that stateless itself pins, so
# the guest never sees two copies of reth. The input/output format is the
# execution-specs one (tests-zkevm v21.0.1): schema-prefixed SSZ
# `StatelessInput` in, plain SSZ `StatelessValidationResult` out.
stateless-validator-reth = { git = "https://github.com/paradigmxyz/stateless", rev = "77293e0349d12326eda436f0d2f7e13c1e400421", default-features = false }
stateless-validator-common = { git = "https://github.com/paradigmxyz/stateless", rev = "77293e0349d12326eda436f0d2f7e13c1e400421", default-features = false }
# Fork activation timestamps per network, used to pick the input schema fork.
alloy-hardforks = "0.4.9"
# Host-side native block execution (offline input generation re-executes a
# block to recover its EIP-7685 requests). Same stateless rev as the guest, and
# the reth crates at the exact rev stateless pins, so the graph stays unified.
stateless = { git = "https://github.com/paradigmxyz/stateless", rev = "77293e0349d12326eda436f0d2f7e13c1e400421", default-features = false }
stateless-tries = { git = "https://github.com/paradigmxyz/stateless", rev = "77293e0349d12326eda436f0d2f7e13c1e400421", package = "tries", default-features = false }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", rev = "db702b511a9dfe5a80ef76685dd93652ffe37cc5", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "db702b511a9dfe5a80ef76685dd93652ffe37cc5", default-features = false }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "db702b511a9dfe5a80ef76685dd93652ffe37cc5", default-features = false }

# types (for ethrex)
primitive-types = "0.13.1"
ethereum-types = "0.15.1"

# ethrex
ethrex-config = { git = "https://github.com/lambdaclass/ethrex.git", tag = "v20.0.0" }
ethrex-common = { git = "https://github.com/lambdaclass/ethrex.git", tag = "v20.0.0", default-features = false }
ethrex-rpc = { git = "https://github.com/lambdaclass/ethrex.git", tag = "v20.0.0" }
ethrex-crypto = { git = "https://github.com/lambdaclass/ethrex.git", tag = "v20.0.0", default-features = false }
stateless-ethrex = { git = "https://github.com/lambdaclass/ethrex.git", tag = "v20.0.0", default-features = false, package = "ethrex-guest-program" }

# common dependencies
anyhow = "1.0"
async-trait = "0.1"
bincode = { version = "2.0", default-features = false, features = [
  "serde",
  "std",
] }
clap = { version = "4.5.7", features = ["derive", "env"] }
dotenv = "0.15.0"
eyre = "0.6.12"
k256 = { version = "0.13.4" }
tiny-keccak = { version = "2.0.0", features = ["keccak"] }
rayon = "1.11.0"
serde = "1.0"
serde_with = "3.14"
serde_json = "1.0"
tokio = { version = "1.21", default-features = false, features = [
  "rt",
  "rt-multi-thread",
] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
jsonrpsee = { version = "0.26", features = ["http-client"] }
http = "1.4.0"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
flate2 = "1"
tar = "0.4"
rkyv = { version = "0.8.10", features = ["std", "unaligned"] }
hex-literal = "0.4.1"

# Route 256-bit MULMOD/ADDMOD through the ZisK arith256_mod accelerator.
# Must match the same patch in bin/guests/stateless-validator-reth/Cargo.toml
# so the native hints-gen/host builds emit the same accelerator hints the
# guest ELF consumes (otherwise the prover's event and hint streams desync).
[patch.crates-io]
ruint = { git = "https://github.com/0xPolygonHermez/zisk-patch-ruint.git", branch = "zisk-patch/v1.19.0" }
# ruint = { path = "../zisk-patch-ruint" }
