[workspace]
members = [
    "bin/host",
    "bin/hints-gen",
    "bin/input-gen",
    "crates/input",
    "crates/input-gen",
    "crates/common/*",
    # Each client is a pair of crates: crates/clients/<client>/{guest,input}.
    # The glob requires that two-level nesting — a crate placed directly at
    # crates/clients/<client>/ is silently NOT a workspace member.
    "crates/clients/*/*",
    "tests",
    "tools/ziskethone-to-reth",
]
exclude = ["tools/migrate-inputs", "third_party/ziskethone/rust-input-gen"]
resolver = "2"

[workspace.package]
version = "0.10.0"
edition = "2021"

[workspace.dependencies]
guest-common = { path = "crates/common/guest-common" }
guest-ethrex = { path = "crates/clients/ethrex/guest" }
guest-reth = { path = "crates/clients/reth/guest" }
guest-ziskethone = { path = "crates/clients/ziskethone/guest" }
input = { path = "crates/input" }
input-core = { path = "crates/common/input-core" }
input-ethrex = { path = "crates/clients/ethrex/input" }
input-reth = { path = "crates/clients/reth/input" }
input-ziskethone = { path = "crates/clients/ziskethone/input" }

zisk-sdk = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "feat/blake3-recursion" }
zisk-zkvm-interface = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "feat/blake3-recursion" }
ziskos = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "feat/blake3-recursion" }
rust-input-gen = { path = "third_party/ziskethone/rust-input-gen" }

# crates.io dependencies
# zisk-sdk = "1.2.0-alpha"
# zisk-zkvm-interface = "1.2.0-alpha"
# ziskos = "1.2.0-alpha"

# Local development
# zisk-sdk = { path = "../zisk/sdk" }
# zisk-zkvm-interface = { path = "../zisk/zkvm-interface" }
# ziskos = { path = "../zisk/ziskos/entrypoint" }

revm = { version = "38.0.0", default-features = false }

# types (for reth)
alloy-rlp = "0.3"
alloy-primitives = "1.5.6"
alloy = "2.0.0"
alloy-consensus = { version = "2.0.0", default-features = false }
alloy-json-rpc = "2.0.0"
alloy-provider = "2.0.0"
alloy-rpc-client = "2.0.0"
alloy-transport = "2.0.0"
alloy-transport-http = { version = "2.0.0", features = ["reqwest"] }
alloy-genesis = "2.0.0"
alloy-eips = "2.0.0"
alloy-rpc-types-eth = "2.0.0"
alloy-rpc-types-debug = "2.0.0"

# reth
reth-primitives-traits = { version = "0.3.0", default-features = false }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v2.1.0", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.1.0", default-features = false }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.1.0", default-features = false }
reth-rpc-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.1.0", default-features = false }
stateless-reth = { git = "https://github.com/paradigmxyz/stateless", rev = "e5480e71a8031641ff471cad9dc482a7a14b32d5", package = "stateless" }
stateless-reth-tries = { git = "https://github.com/paradigmxyz/stateless", rev = "e5480e71a8031641ff471cad9dc482a7a14b32d5", package = "tries" }

# types (for ethrex)
primitive-types = "0.13.1"
ethereum-types = "0.15.1"

# ethrex
ethrex-config = { git = "https://github.com/lambdaclass/ethrex.git", tag = "v20.0.0" }
ethrex-common = { git = "https://github.com/lambdaclass/ethrex.git", tag = "v20.0.0", default-features = false }
ethrex-rpc = { git = "https://github.com/lambdaclass/ethrex.git", tag = "v20.0.0" }
ethrex-crypto = { git = "https://github.com/lambdaclass/ethrex.git", tag = "v20.0.0", default-features = false }
stateless-ethrex = { git = "https://github.com/lambdaclass/ethrex.git", tag = "v20.0.0", default-features = false, package = "ethrex-guest-program" }

# eth-act
witness-generator = { git = "https://github.com/eth-act/zkevm-benchmark-workload.git", rev = "6786b2b9f002151e383e88cf2a693899ca73d169" }

# common dependencies
anyhow = "1.0"
async-trait = "0.1"
bincode = { version = "2.0", default-features = false, features = [
  "serde",
  "std",
] }
clap = { version = "4.5.7", features = ["derive", "env"] }
dotenv = "0.15.0"
eyre = "0.6.12"
k256 = { version = "0.13.4" }
tiny-keccak = { version = "2.0.0", features = ["keccak"] }
rayon = "1.11.0"
serde = "1.0"
serde_with = "3.14"
serde_json = "1.0"
tokio = { version = "1.21", default-features = false, features = [
  "rt",
  "rt-multi-thread",
] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
jsonrpsee = { version = "0.26", features = ["http-client"] }
http = "1.4.0"
tempfile = "3"
rkyv = { version = "0.8.10", features = ["std", "unaligned"] }
hex-literal = "0.4.1"

# Route 256-bit MULMOD/ADDMOD through the ZisK arith256_mod accelerator.
# Must match the same patch in bin/guests/stateless-validator-reth/Cargo.toml
# so the native hints-gen/host builds emit the same accelerator hints the
# guest ELF consumes (otherwise the prover's event and hint streams desync).
[patch.crates-io]
ruint = { git = "https://github.com/0xPolygonHermez/zisk-patch-ruint.git", branch = "zisk-patch/v1.19.0" }
# ruint = { path = "../zisk-patch-ruint" }
